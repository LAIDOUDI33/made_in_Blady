  /bulk-pricing/{productId}:
    get:
      tags:
        - Product Features
      summary: Get bulk pricing tiers
      description: |
        Retrieve bulk pricing tiers for a specific product.
        
        ## Bulk Pricing Logic
        Pricing tiers allow quantity-based discounts:
        - Higher quantities = Lower unit prices
        - Best value tier is highlighted
        - Discounts can be percentage-based or fixed price
        
        ## Example Tiers
        | Min Qty | Unit Price | Discount |
        |---------|-----------|----------|
        | 1       | 1000 DZD  | 0%       |
        | 10      | 950 DZD   | 5%       |
        | 50      | 900 DZD   | 10%      |
        | 100     | 850 DZD   | 15%      |
      operationId: getBulkPricing
      parameters:
        - name: productId
          in: path
          description: Product ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bulk pricing tiers for the product
          content:
            application/json:
              schema:
                type: object
                properties:
                  productId:
                    type: string
                  basePrice:
                    type: number
                    description: Single unit price
                  currency:
                    type: string
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkPricingTier'
              example:
                productId: "product_123"
                basePrice: 1000
                currency: DZD
                tiers:
                  - id: "tier_001"
                    minQuantity: 1
                    maxQuantity: 9
                    unitPrice: 1000
                    discountPercent: 0
                  - id: "tier_002"
                    minQuantity: 10
                    maxQuantity: 49
                    unitPrice: 950
                    discountPercent: 5
                  - id: "tier_003"
                    minQuantity: 50
                    maxQuantity: 99
                    unitPrice: 900
                    discountPercent: 10
                    isBestValue: true
                  - id: "tier_004"
                    minQuantity: 100
                    unitPrice: 850
                    discountPercent: 15
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Product Features
      summary: Create bulk pricing tier
      description: Add a new bulk pricing tier to a product. Tiers should be ordered by increasing quantity.
      operationId: createBulkPricingTier
      parameters:
        - name: productId
          in: path
          description: Product ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkPricingRequest'
            example:
              minQuantity: 50
              maxQuantity: 99
              unitPrice: 900
              discountPercent: 10
              currency: DZD
              validFrom: "2024-03-15T00:00:00Z"
              validUntil: "2024-12-31T23:59:59Z"
      responses:
        '201':
          description: Bulk pricing tier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPricingTier'
              example:
                id: "tier_new_001"
                productId: "product_123"
                minQuantity: 50
                maxQuantity: 99
                unitPrice: 900
                discountPercent: 10
                currency: DZD
                createdAt: "2024-03-15T14:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    put:
      tags:
        - Product Features
      summary: Update bulk pricing tiers
      description: Update multiple bulk pricing tiers at once. Send the complete array of tiers.
      operationId: updateBulkPricing
      parameters:
        - name: productId
          in: path
