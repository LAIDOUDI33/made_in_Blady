  # ============================================
  /shipping/rates:
    get:
      tags:
        - Shipping & Logistics
      summary: Get shipping rates
      description: |
        Calculate shipping costs between two locations.
        
        ## Coverage
        All 58 Algerian wilayas supported with accurate rate calculation.
        
        ## Available Methods
        - **STANDARD**: Regular ground delivery (3-7 days)
        - **EXPRESS**: Priority delivery (1-2 days)
        - **AIR_FREIGHT**: Air cargo for urgent/large shipments
        - **SEA_FREIGHT**: Ocean freight for international
        - **RAIL_FREIGHT**: Rail transport where available
        - **PICKUP**: Customer pickup from warehouse
        - **WHITE_GLOVE**: Premium handling with installation
        
        ## Dynamic Pricing Factors
        - Base route rate
        - Weight (per kg)
        - Volume (per m³)
        - Distance fuel surcharge
        - Handling fees
      operationId: getShippingRates
      parameters:
        - name: originWilaya
          in: query
          description: Origin wilaya code (e.g., "16" for Alger)
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 3
        - name: destinationWilaya
          in: query
          description: Destination wilaya code
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 3
        - name: weight
          in: query
          description: Total weight in kg
          required: true
          schema:
            type: number
            minimum: 0.1
            maximum: 50000
        - name: volume
          in: query
          description: Volume in cubic meters (m³)
          schema:
            type: number
            minimum: 0.001
        - name: method
          in: query
          description: Shipping method filter (optional, returns all if not specified)
          schema:
            $ref: '#/components/schemas/ShippingMethod'
      responses:
        '200':
          description: Available shipping rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingRatesResponse'
              example:
                originWilaya: "16"
                destinationWilaya: "31"
                weight: 25
                volume: 0.5
                rates:
                  - method: STANDARD
                    carrierName: "AlgeriaPost Express"
                    basePrice: 1500
                    weightPrice: 50
                    volumePrice: 200
                    totalPrice: 3250
                    currency: DZD
                    estimatedDaysMin: 3
                    estimatedDaysMax: 5
                    trackingSupported: true
                  - method: EXPRESS
                    carrierName: "Speedy DZ"
                    basePrice: 2500
                    weightPrice: 100
                    volumePrice: 400
                    totalPrice: 7000
                    currency: DZD
                    estimatedDaysMin: 1
                    estimatedDaysMax: 2
                    trackingSupported: true
                  - method: WHITE_GLOVE
                    carrierName: "Premium Logistics"
                    basePrice: 5000
                    weightPrice: 200
                    volumePrice: 600
                    totalPrice: 11500
                    currency: DZD
                    estimatedDaysMin: 2
                    estimatedDaysMax: 3
                    trackingSupported: true
                    includesInstallation: true
                recommendedMethod: EXPRESS
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid wilaya code: 99"
                code: INVALID_WILAYA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

