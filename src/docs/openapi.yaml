      summary: List shipments
      description: |
        Retrieve shipments with tracking information.
        
        ## Shipment Status Flow
        `PENDING` → `READY_TO_SHIP` → `SHIPPED` → `IN_TRANSIT` → `OUT_FOR_DELIVERY` → `DELIVERED`
        
        Exception states:
        - **EXCEPTION**: Delivery issue encountered
        - **RETURNED**: Returned to sender
        - **LOST**: Shipment lost in transit
        
        ## Incoterms Reference
        Supported incoterms define responsibility boundaries between buyer and seller.
      operationId: listShipments
      parameters:
        - name: page
          in: query
