          type: integer
          minimum: 0
          maximum: 100
          description: Verification score (for approvals)
        categoryScores:
          type: object
          description: Detailed category scores
        notes:
          type: string
          description: Review notes/comments
        rejectionReason:
          type: string
          description: Reason for rejection (required when rejecting)

    # ----------------------------------------
    # ESCROW SCHEMAS
    # ----------------------------------------
    EscrowAccount:
      type: object
      properties:
        id:
          type: string
