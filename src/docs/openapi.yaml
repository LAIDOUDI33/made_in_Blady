        level:
          $ref: '#/components/schemas/VerificationLevel'
          description: Target verification level (optional, inferred from type)
        documents:
          type: array
          items:
            type: string
            format: uri
          description: Supporting document URLs

    ReviewVerificationRequest:
      type: object
      required:
