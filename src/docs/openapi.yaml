  /trending:
    get:
      tags:
        - Search & Discovery
      summary: Get trending products
      description: |
        Retrieve trending products based on weighted scoring algorithm.
        
        ## Scoring Algorithm
        Trending score is calculated using weighted factors:
        - View count weight: 1.0x
        - Inquiry/RFQ count weight: 2.5x
        - Order count weight: 3.0x
        - Favorite count weight: 1.5x
        
        ## Period Types
        - **daily**: Last 24 hours trends
        - **weekly**: Last 7 days trends (default)
        - **monthly**: Last 30 days trends
        
        ## Rank Movement Indicators
        - ↑ : Moved up from previous period
        - ↓ : Moved down from previous period
        - ★ : New entry in top rankings
        - — : No change in rank
      operationId: getTrendingProducts
      parameters:
        - name: periodType
          in: query
          description: Analysis period
          required: false
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: weekly
        - name: categoryId
          in: query
          description: Filter by category
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results (max 50)
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
