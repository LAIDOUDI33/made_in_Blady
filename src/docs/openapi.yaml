openapi: 3.0.1
info:
  title: AlgeriaTrade.dz B2B Platform API
  description: |
    Comprehensive REST API documentation for the AlgeriaTrade.dz B2B Marketplace Platform.
    
    ## Overview
    AlgeriaTrade.dz is a premier B2B marketplace platform designed for the Algerian market with 
    multi-tenant support, multilingual capabilities (Arabic, French, English), and comprehensive 
    trade features.
    
    ## Features
    - **Supplier Verification**: Multi-level verification system (BASIC to ENTERPRISE)
    - **Trade Assurance**: Escrow payment system with dispute resolution
    - **Video Showroom**: Product demos, factory tours, virtual tours
    - **Advanced Products**: Certifications, bulk pricing, customization options
    - **Quality Control**: Pre-shipment inspection services
    - **Exhibitions**: Virtual trade shows and events
    - **Market Intelligence**: Trending products, market insights, buying guides
    - **Shipping & Logistics**: Rate calculator, shipment tracking
    
    ## Authentication
    All protected endpoints require a Bearer token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Base URL
    ```
    https://api.algeriatrade.dz/api
    ```
    
    ## Version
    This documentation covers Phase 6 APIs (Feature Parity with Made-in-China.com)
    
    *Implementation completed: August 2026*
  version: 2.0.0
  contact:
    name: AlgeriaTrade.dz API Support
    email: api-support@algeriatrade.dz
    url: https://algeriatrade.dz/support
  license:
    name: Proprietary
    url: https://algeriatrade.dz/terms

servers:
  - url: /api
    description: Production API Server
  - url: http://localhost:3000/api
    description: Development Server

tags:
  # Phase 6A Tags
  - name: Verification System
    description: Supplier verification and trust badge management
    x-displayName: 🔐 Verification System
  # Phase 6B Tags  
  - name: Escrow & Trade Assurance
    description: Escrow accounts and dispute resolution
    x-displayName: 💰 Escrow & Trade Assurance
  # Phase 6C Tags
  - name: Video System
    description: Product videos, company videos, and virtual tours
    x-displayName: 🎬 Video System
  # Phase 6D Tags
  - name: Product Features
    description: Certifications, bulk pricing, customization, packages
    x-displayName: 📦 Product Features
  # Phase 6E Tags
  - name: Inspection System
    description: Quality control inspection services and bookings
    x-displayName: 🔍 Inspection System
  # Phase 6F Tags
  - name: Exhibitions
    description: Virtual trade shows, events, and booth management
    x-displayName: 🎪 Exhibitions
  # Phase 6G Tags
  - name: Search & Discovery
    description: Trending products, market insights, buying guides
    x-displayName: 📊 Search & Discovery
  # Phase 6H Tags
  - name: Shipping & Logistics
    description: Shipping rates calculator and shipment tracking
    x-displayName: 🚚 Shipping & Logistics

paths:
  # ============================================
  # PHASE 6A: VERIFICATION SYSTEM
  # ============================================
  /verification:
    get:
      tags:
        - Verification System
      summary: List verifications
      description: |
        Retrieve a paginated list of supplier verifications with filtering options.
        
        ## Permissions
        - **Admin**: Can view all verifications
        - **Supplier**: Can view own company's verifications
        
        ## Filtering Options
        Filter by status, level, type, or company ID to find specific verifications.
      operationId: listVerifications
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by verification status
          required: false
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: level
          in: query
          description: Filter by verification level
          required: false
          schema:
            $ref: '#/components/schemas/VerificationLevel'
        - name: companyId
          in: query
          description: Filter by company ID
          required: false
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Filter by verification type
          required: false
          schema:
            $ref: '#/components/schemas/VerificationType'
      responses:
        '200':
          description: Successful response with paginated verification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVerifications'
              example:
                data:
                  - id: "clxxxxxx1"
                    companyId: "company123"
                    level: VERIFIED
                    status: VERIFIED
                    type: BUSINESS_LICENSE
                    score: 85
                    issuedAt: "2024-01-15T10:00:00Z"
                    expiresAt: "2025-01-15T10:00:00Z"
                    isValid: true
                    certificateNumber: "VER-2024-001234"
                    createdAt: "2024-01-10T08:00:00Z"
                  - id: "clxxxxxx2"
                    companyId: "company123"
                    level: CERTIFIED
                    status: PENDING
                    type: SGS_AUDIT
                    createdAt: "2024-02-01T09:00:00Z"
                pagination:
                  total: 25
                  page: 1
                  limit: 20
                  totalPages: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Verification System
      summary: Create verification request
      description: |
        Submit a new verification request for a company.
        
        ## Verification Levels
        - **BASIC**: Email & phone verification (automatic)
        - **VERIFIED**: Business documents verification
        - **CERTIFIED**: On-site inspection required
        - **PREMIUM**: Third-party audit (SGS/TUV)
        - **ENTERPRISE**: Full enterprise verification
        
        ## Required Documents
        Based on verification type, different documents may be required:
        - Business License: Registration certificate, tax ID
        - Identity: National ID or passport
        - Bank Account: Bank statement, RIB
      operationId: createVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationRequest'
            example:
              companyId: "company123"
              type: BUSINESS_LICENSE
              level: VERIFIED
              documents:
                - "https://storage.algeriatrade.dz/docs/business_license.pdf"
                - "https://storage.algeriatrade.dz/docs/tax_certificate.pdf"
      responses:
        '201':
          description: Verification request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
              example:
                id: "clxxxxxx3"
                companyId: "company123"
                level: VERIFIED
                status: PENDING
                type: BUSINESS_LICENSE
                documents:
                  - "https://storage.algeriatrade.dz/docs/business_license.pdf"
                isValid: false
                createdAt: "2024-03-01T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /verification/{id}:
    get:
      tags:
        - Verification System
      summary: Get verification details
      description: Retrieve detailed information about a specific verification record including review history and attached documents.
      operationId: getVerification
      parameters:
        - name: id
          in: path
          description: Verification ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
              example:
                id: "clxxxxxx1"
                companyId: "company123"
                level: PREMIUM
                status: VERIFIED
                type: SGS_AUDIT
                inspectorName: "Ahmed Benali"
                inspectionDate: "2024-01-20T14:00:00Z"
                score: 92
                categoryScores:
                  quality: 95
                  capacity: 90
                  compliance: 92
                  management: 91
                issuedAt: "2024-01-22T10:00:00Z"
                expiresAt: "2025-01-22T10:00:00Z"
                isValid: true
                reviewedBy: "admin_user_001"
                reviewedAt: "2024-01-22T11:00:00Z"
                certificateNumber: "SGS-DZ-2024-00042"
                badgeUrl: "https://cdn.algeriatrade.dz/badges/premium.png"
                certificateUrl: "https://cdn.algeriatrade.dz/certs/SGS-DZ-2024-00042.pdf"
                createdAt: "2024-01-05T09:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    put:
      tags:
        - Verification System
      summary: Review verification (Admin)
      description: |
        Admin endpoint to review and approve/reject verification requests.
        
        ## Review Actions
        - **Approve**: Set status to VERIFIED, issue certificate number
        - **Reject**: Set status to REJECTED with reason
        - **Request More Info**: Keep PENDING status with notes
        
        ## Automatic Badge Assignment
        Upon approval, corresponding badges are automatically awarded based on verification level.
      operationId: reviewVerification
      parameters:
        - name: id
          in: path
          description: Verification ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewVerificationRequest'
            examples:
              approve:
                summary: Approve verification
                value:
                  action: approve
                  status: VERIFIED
                  score: 88
                  categoryScores:
                    quality: 90
                    capacity: 85
                    compliance: 88
                  notes: "All documents verified successfully"
              reject:
                summary: Reject verification
                value:
                  action: reject
                  status: REJECTED
                  rejectionReason: "Business license expired. Please provide updated document."
      responses:
        '200':
          description: Verification review completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
              example:
                id: "clxxxxxx1"
                companyId: "company123"
                level: VERIFIED
                status: VERIFIED
                type: BUSINESS_LICENSE
                score: 88
                isValid: true
                reviewedBy: "admin_001"
                reviewedAt: "2024-03-01T14:30:00Z"
                certificateNumber: "VER-2024-001256"
                createdAt: "2024-02-20T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  # ============================================
  # PHASE 6B: ESCROW & TRADE ASSURANCE
  # ============================================
  /escrow:
    get:
      tags:
        - Escrow & Trade Assurance
      summary: List escrow accounts
      description: |
        Retrieve escrow accounts with optional filtering.
        
        ## Access Control
        - **Buyers** can see their own escrow accounts
        - **Suppliers** can see escrows where they are the seller
        - **Admins** can view all escrow accounts
        
        ## Escrow Status Flow
        `PENDING` → `FUNDED` → `IN_ESCROW` → `RELEASED` | `REFUNDED` | `DISPUTED`
      operationId: listEscrowAccounts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          description: Filter by escrow status
          schema:
            $ref: '#/components/schemas/EscrowStatus'
        - name: buyerId
          in: query
          description: Filter by buyer user ID
          schema:
            type: string
        - name: supplierCompanyId
          in: query
          description: Filter by supplier company ID
          schema:
            type: string
      responses:
        '200':
          description: List of escrow accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEscrowAccounts'
              example:
                data:
                  - id: "esc_xxxx1"
                    accountId: "ESC-2024-000042"
                    orderId: "order_12345"
                    amount: 150000
                    currency: DZD
                    status: IN_ESCROW
                    buyerId: "user_buyer_001"
                    supplierCompanyId: "company_supplier_001"
                    autoReleaseDays: 30
                    fundedAt: "2024-03-01T10:00:00Z"
                    inEscrowAt: "2024-03-01T10:05:00Z"
                    autoReleaseAt: "2024-03-31T10:00:00Z"
                    createdAt: "2024-03-01T09:55:00Z"
                pagination:
                  total: 12
                  page: 1
                  limit: 20
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Escrow & Trade Assurance
      summary: Create escrow account
      description: |
        Create a new escrow account for an order.
        
        ## How It Works
        1. Buyer places order with trade assurance
        2. Escrow account is created in PENDING state
        3. Buyer funds the escrow account
        4. Funds held until delivery confirmation or dispute resolution
        
        ## Platform Fee
        A 2% platform fee is automatically calculated on the escrow amount.
      operationId: createEscrowAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscrowRequest'
            example:
              orderId: "order_12345"
              amount: 150000
              currency: DZD
              buyerId: "user_buyer_001"
              supplierCompanyId: "company_supplier_001"
              autoReleaseDays: 30
              paymentMethod: "baridimob"
      responses:
        '201':
          description: Escrow account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAccount'
              example:
                id: "esc_new_001"
                accountId: "ESC-2024-000050"
                orderId: "order_12345"
                amount: 150000
                currency: DZD
                feeAmount: 3000
                status: PENDING
                buyerId: "user_buyer_001"
                supplierCompanyId: "company_supplier_001"
                autoReleaseDays: 30
                createdAt: "2024-03-15T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /escrow/{id}:
    post:
      tags:
        - Escrow & Trade Assurance
      summary: Perform escrow action
      description: |
        Execute actions on an escrow account including funding, release, refund, and dispute initiation.
        
        ## Available Actions
        
        ### fund
        Add funds to the escrow account. Requires payment processing integration.
        
        ### release
        Request release of funds to supplier. Can be automatic after autoReleaseDays.
        
        ### refund
        Initiate refund to buyer. Requires valid reason.
        
        ### dispute
        Open a dispute for mediation/arbitration.
        
        ## Dispute Reasons
        - Product not as described
        - Quality issues
        - Shipping delay
        - Wrong item received
        - Damaged goods
        - Quantity mismatch
        - Missing accessories
        - Other (with description)
      operationId: performEscrowAction
      parameters:
        - name: id
          in: path
          description: Escrow account ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowActionRequest'
            examples:
              fund:
                summary: Fund escrow account
                value:
                  action: fund
                  amount: 150000
                  paymentReference: "PAY-BM-2024-000123"
              release:
                summary: Release funds to supplier
                value:
                  action: release
                  notes: "Goods received in good condition"
              refund:
                summary: Request refund
                value:
                  action: refund
                  reason: "Product does not match description"
                  requestedAmount: 150000
              dispute:
                summary: Open dispute
                value:
                  action: dispute
                  title: "Quality issues with electronic components"
                  description: "Received items have visible defects and don't match specifications"
                  reason: QUALITY_ISSUES
                  requestedAmount: 150000
                  evidence:
                    - type: photo
                      url: "https://storage.algeriatrade.dz/evidence/photo1.jpg"
                      description: "Defect on circuit board"
                    - type: document
                      url: "https://storage.algeriatrade.dz/evidence/specs.pdf"
                      description: "Original product specifications"
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EscrowAccount'
                  - $ref: '#/components/schemas/Dispute'
              example:
                id: "esc_xxxx1"
                accountId: "ESC-2024-000042"
                status: RELEASED
                releasedAmount: 147000
                feeAmount: 3000
                releasedAt: "2024-03-20T14:00:00Z"
                message: "Funds released to supplier successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict - Action not allowed in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Cannot release funds from escrow in DISPUTED status"
                code: ESCROW_STATE_INVALID
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  # ============================================
  # PHASE 6C: VIDEO SYSTEM
  # ============================================
  /videos:
    get:
      tags:
        - Video System
      summary: List videos
      description: |
        Retrieve videos with filtering options. Supports both product videos and company videos.
        
        ## Video Types
        - **product_demo**: Product demonstration video
        - **factory_tour**: Factory/facility tour
        - **testimonial**: Customer testimonial
        - **tutorial**: Usage tutorial or how-to guide
        - **company_intro**: Company introduction
        - **production_line**: Production line showcase
        - **ceo_message**: CEO or executive message
        - **exhibition**: Exhibition recording
        
        ## Processing Status
        Videos go through processing before becoming available:
        `processing` → `ready` | `failed`
      operationId: listVideos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: productId
          in: query
          description: Filter by product ID
          schema:
            type: string
        - name: companyId
          in: query
          description: Filter by company ID
          schema:
            type: string
        - name: type
          in: query
          description: Filter by video type
          schema:
            type: string
            enum: [product_demo, factory_tour, testimonial, tutorial, company_intro, production_line, ceo_message, exhibition]
        - name: language
          in: query
          description: Filter by language code
          schema:
            type: string
            enum: [ar, fr, en]
        - name: status
          in: query
          description: Filter by processing status
          schema:
            type: string
            enum: [processing, ready, failed]
      responses:
        '200':
          description: List of videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVideos'
              example:
                data:
                  - id: "vid_prod_001"
                    productId: "product_123"
                    title: "Industrial Pump Demo"
                    description: "Complete demonstration of our industrial pump series"
                    videoUrl: "https://video.algeriatrade.dz/pump-demo.mp4"
                    thumbnailUrl: "https://cdn.algeriatrade.dz/thumbs/pump-demo.jpg"
                    duration: 180
                    type: product_demo
                    language: en
                    isPrimary: true
                    status: ready
                    viewCount: 1250
                    createdAt: "2024-02-15T10:00:00Z"
                pagination:
                  total: 45
                  page: 1
                  limit: 20
                  totalPages: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Video System
      summary: Upload video
      description: |
        Upload a new video. Supports multipart/form-data for file upload or JSON with external URL.
        
        ## Supported Formats
        - MP4 (recommended)
        - WebM
        - MOV
        
        ## File Size Limits
        - Maximum: 500MB for regular users
        - Maximum: 2GB for premium suppliers
        
        ## Processing Time
        Videos typically process within 5-30 minutes depending on length.
      operationId: uploadVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VideoUploadForm'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              productId: "product_123"
              title: "Product Overview Video"
              description: "Comprehensive overview of features and benefits"
              videoUrl: "https://external-cdn.com/video.mp4"
              thumbnailUrl: "https://external-cdn.com/thumb.jpg"
              type: product_demo
              language: fr
              isPrimary: false
      responses:
        '201':
          description: Video uploaded successfully, processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
              example:
                id: "vid_new_001"
                productId: "product_123"
                title: "Product Overview Video"
                description: "Comprehensive overview of features and benefits"
                videoUrl: "https://storage.algeriatrade.dz/videos/vid_new_001.mp4"
                type: product_demo
                language: fr
                isPrimary: false
                status: processing
                viewCount: 0
                createdAt: "2024-03-15T14:30:00Z"
                message: "Video uploaded successfully. Processing will complete shortly."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload too large - exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Video file exceeds maximum size limit of 500MB"
                code: FILE_TOO_LARGE
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /videos/company/{companyId}/tours:
    post:
      tags:
        - Video System
      summary: Create virtual tour
      description: |
        Create a new 360° virtual tour for a company.
        
        ## Tour Types
        - **factory**: Factory or production facility tour
        - **office**: Office space tour
        - **showroom**: Product showroom tour
        - **warehouse**: Warehouse or storage facility tour
        
        ## Hotspot Format
        Hotspots are interactive points within the 360° view that can contain:
        - Information text
        - Media (images, videos)
        - Links to products or pages
        
        ```json
        [
          {
            "position": { "x": 0.5, "y": 0.3 },
            "title": "Production Line A",
            "content": "Our main production line with 50 units/day capacity",
            "mediaUrl": "https://..."
          }
        ]
        ```
      operationId: createVirtualTour
      parameters:
        - name: companyId
          in: path
          description: Company ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualTourRequest'
            example:
              title: "Main Factory Virtual Tour"
              description: "Interactive 360° tour of our Algiers manufacturing facility"
              tourUrl: "https://tour.algeriatrade.dz/factory-main/index.html"
              coverImage: "https://cdn.algeriatrade.dz/tours/factory-cover.jpg"
              type: factory
              hotspots:
                - position:
                    x: 0.3
                    y: 0.4
                  title: "Assembly Area"
                  content: "Main assembly area with automated systems"
                  mediaUrl: "https://cdn.algeriatrade.dz/tours/assembly.jpg"
                - position:
                    x: 0.7
                    y: 0.6
                  title: "Quality Control Lab"
                  content: "ISO 9001 certified testing facility"
      responses:
        '201':
          description: Virtual tour created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualTour'
              example:
                id: "tour_001"
                companyId: "company_123"
                title: "Main Factory Virtual Tour"
                description: "Interactive 360° tour of our Algiers manufacturing facility"
                tourUrl: "https://tour.algeriatrade.dz/factory-main/index.html"
                coverImage: "https://cdn.algeriatrade.dz/tours/factory-cover.jpg"
                type: factory
                hotspots:
                  - position:
                      x: 0.3
                      y: 0.4
                    title: "Assembly Area"
                    content: "Main assembly area with automated systems"
                viewCount: 0
                createdAt: "2024-03-15T16:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
