components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer Token Authentication
        
        ## Obtaining a Token
        Authenticate via `/api/auth/login` to receive a JWT token.
        
        ## Token Format
        Header: `Authorization: Bearer <jwt_token>`
        
        ## Token Expiry
        Tokens expire after 24 hours. Use refresh token to obtain new access token.

  responses:
    BadRequest:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationError:
              summary: Validation Error
              value:
                error: "Validation failed"
                code: VALIDATION_ERROR
                details:
                  - field: "email"
                    message: "Invalid email format"
                  - field: "phone"
                    message: "Phone number is required"
            invalidInput:
              summary: Invalid Input
              value:
                error: "Invalid input: amount must be positive"
                code: INVALID_INPUT

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Authentication required"
            code: UNAUTHORIZED
            message: "Please provide a valid Bearer token in Authorization header"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Access denied"
            code: FORBIDDEN
            message: "You don't have permission to perform this action"

    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"
            code: NOT_FOUND
            message: "The requested resource could not be found"

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
            code: INTERNAL_ERROR
            message: "An unexpected error occurred. Please try again later."

  schemas:
    # ----------------------------------------
    # COMMON SCHEMAS
    # ----------------------------------------
    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Additional error details
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          description: Field-level validation errors
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages

    # ----------------------------------------
    # ENUM SCHEMAS
    # ----------------------------------------
    VerificationLevel:
      type: string
      enum:
        - BASIC
        - VERIFIED
        - CERTIFIED
        - PREMIUM
        - ENTERPRISE
      description: |
        Supplier verification levels:
        - **BASIC**: Email & phone verified
        - **VERIFIED**: Business documents verified
        - **CERTIFIED**: On-site inspection passed
        - **PREMIUM**: SGS/TUV third-party audit
        - **ENTERPRISE**: Full enterprise verification

    VerificationStatus:
      type: string
      enum:
        - PENDING
        - VERIFIED
        - REJECTED
        - SUSPENDED
      description: Verification request status

    VerificationType:
      type: string
      enum:
        - BUSINESS_LICENSE
        - TAX_COMPLIANCE
        - BANK_ACCOUNT
        - IDENTITY
        - ADDRESS
        - PHONE
        - EMAIL
        - PRODUCT_QUALITY
        - PRODUCTION_CAPACITY
        - EXPORT_LICENSE
        - ISO_CERTIFICATION
        - SGS_AUDIT
        - CUSTOM
      description: Types of verification available

    EscrowStatus:
      type: string
      enum:
        - PENDING
        - FUNDED
        - IN_ESCROW
        - RELEASED
        - REFUNDED
        - PARTIAL_REFUND
        - DISPUTED
        - CANCELLED
      description: Escrow account lifecycle status

    DisputeStatus:
      type: string
      enum:
        - OPEN
        - INVESTIGATING
        - MEDIATION
        - ARBITRATION
        - RESOLVED
        - CANCELLED
      description: Dispute resolution status

    DisputeReason:
      type: string
      enum:
        - NOT_AS_DESCRIBED
        - QUALITY_ISSUES
        - SHIPPING_DELAY
        - WRONG_ITEM
        - DAMAGED_GOODS
        - QUANTITY_MISMATCH
        - MISSING_ACCESSORIES
        - OTHER
      description: Reasons for opening a dispute

    InspectionStatus:
      type: string
      enum:
        - REQUESTED
        - SCHEDULED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - FAILED
      description: Inspection booking status

    InspectionType:
      type: string
      enum:
        - PRE_PRODUCTION
        - DURING_PRODUCTION
        - PRE_SHIPMENT
        - CONTAINER_LOADING
        - SAMPLE_INSPECTION
        - FACTORY_AUDIT
      description: Types of inspection services

    ExhibitionStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - LIVE
        - ENDED
        - CANCELLED
      description: Exhibition lifecycle status

    ExhibitionType:
      type: string
      enum:
        - VIRTUAL_TRADE_SHOW
        - INDUSTRY_EVENT
        - PRODUCT_LAUNCH
        - PROCUREMENT_EVENT
        - NETWORKING_EVENT
      description: Types of exhibitions/events

    ShippingMethod:
      type: string
      enum:
        - STANDARD
        - EXPRESS
        - AIR_FREIGHT
        - SEA_FREIGHT
        - RAIL_FREIGHT
        - PICKUP
        - WHITE_GLOVE
      description: Available shipping methods

    Incoterm:
      type: string
      enum:
        - EXW
        - FCA
        - CPT
        - CIP
        - DAP
        - DDP
        - FAS
        - FOB
        - CFR
        - CIF
      description: |
        International commercial terms defining buyer/seller responsibilities:
        - **EXW**: Ex Works - Seller's premises
        - **FCA**: Free Carrier - Named place
        - **CPT**: Carriage Paid To - Destination
        - **CIP**: Carriage and Insurance Paid To
        - **DAP**: Delivered at Place - Destination
        - **DDP**: Delivered Duty Paid - Destination (seller pays all)
        - **FAS**: Free Alongside Ship
        - **FOB**: Free on Board - Vessel
        - **CFR**: Cost and Freight - Destination
        - **CIF**: Cost Insurance Freight - Destination

    ShipmentStatus:
      type: string
      enum:
        - PENDING
        - READY_TO_SHIP
        - SHIPPED
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERED
        - EXCEPTION
        - RETURNED
        - LOST
      description: Shipment tracking status

    # ----------------------------------------
    # VERIFICATION SCHEMAS
    # ----------------------------------------
    Verification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique verification ID
        companyId:
          type: string
          description: Company being verified
        level:
          $ref: '#/components/schemas/VerificationLevel'
        status:
          $ref: '#/components/schemas/VerificationStatus'
        type:
          $ref: '#/components/schemas/VerificationType'
        documents:
          type: array
          items:
            type: string
          description: Array of document URLs
        inspectorName:
          type: string
          description: Assigned inspector name
        inspectorId:
          type: string
          description: Inspector user ID
        inspectionDate:
          type: string
          format: date-time
          description: When inspection was conducted
        inspectionNotes:
          type: string
          description: Notes from inspection
        inspectionPhotos:
          type: array
          items:
            type: string
          description: Photo evidence URLs
        inspectionVideos:
          type: array
          items:
            type: string
          description: Video evidence URLs
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall verification score
        categoryScores:
          type: object
          description: Category-wise scores as JSON object
        issuedAt:
          type: string
          format: date-time
          description: When certificate was issued
        expiresAt:
          type: string
          format: date-time
          description: Certificate expiration date
        isValid:
          type: boolean
          description: Whether verification is currently valid
        reviewedBy:
          type: string
          description: Admin reviewer ID
        reviewedAt:
          type: string
          format: date-time
          description: When review was completed
        reviewNotes:
          type: string
          description: Review comments
        rejectionReason:
          type: string
          description: Reason for rejection (if rejected)
        badgeUrl:
          type: string
          format: uri
          description: Awarded badge image URL
        certificateUrl:
          type: string
          format: uri
          description: Certificate document URL
        certificateNumber:
          type: string
          description: Unique certificate identifier
        createdAt:
          type: string
          format: date-time

    PaginatedVerifications:
      type: object
