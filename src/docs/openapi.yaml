  # ============================================
  # PHASE 6E: INSPECTION SYSTEM
  # ============================================
  /inspection:
    get:
      tags:
        - Inspection System
      summary: List inspections
      description: |
        Retrieve inspection services and bookings.
        
        ## Service Types
        - **PRE_PRODUCTION**: Raw material and pre-production checks
        - **DURING_PRODUCTION**: In-process quality monitoring
        - **PRE_SHIPMENT**: Final inspection before shipping (most popular)
        - **CONTAINER_LOADING**: Supervision during container loading
        - **SAMPLE_INSPECTION**: Random sample testing
        - **FACTORY_AUDIT**: Comprehensive facility audit
        
        ## Booking Status Flow
        `REQUESTED` → `SCHEDULED` → `IN_PROGRESS` → `COMPLETED` | `FAILED` | `CANCELLED`
      operationId: listInspections
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          description: Filter by service type
          schema:
            $ref: '#/components/schemas/InspectionType'
        - name: status
          in: query
          description: Filter by booking status
          schema:
            $ref: '#/components/schemas/InspectionStatus'
        - name: buyerId
          in: query
          schema:
            type: string
        - name: serviceOnly
          in: query
          description: Return only service definitions, no bookings
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of inspections/services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInspections'
              example:
                services:
                  - id: "svc_pre_ship"
                    name: "Pre-Shipment Inspection"
                    description: "Final quality check before goods leave the factory"
                    type: PRE_SHIPMENT
                    basePrice: 25000
                    currency: DZD
                    typicalLeadTime: 3
                    isActive: true
                  - id: "svc_factory_audit"
                    name: "Factory Audit"
                    description: "Comprehensive audit of manufacturing facilities"
                    type: FACTORY_AUDIT
                    basePrice: 75000
                    currency: DZD
                    typicalLeadTime: 5
                    isActive: true
                bookings:
                  - id: "book_001"
                    bookingNumber: "INSPECT-2024-00042"
                    serviceId: "svc_pre_ship"
                    status: SCHEDULED
                    preferredDate: "2024-03-20T09:00:00Z"
                    scheduledAt: "2024-03-20T10:00:00Z"
                    inspectorName: "Karim Hadj-Ahmed"
                    createdAt: "2024-03-15T11:00:00Z"
                pagination:
