                  totalBookings: 15
                  page: 1
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags:
        - Inspection System
      summary: Book inspection service
      description: |
        Book an inspection service for quality control.
        
        ## Urgent Requests
        Mark as urgent for +50% surcharge but faster scheduling (typically within 24-48 hours).
        
        ## What Happens Next
        1. Booking confirmed with unique booking number
        2. Inspector assigned based on availability
        3. Schedule confirmed via email/SMS
        4. Inspector conducts inspection
        5. Report generated within 24 hours of completion
