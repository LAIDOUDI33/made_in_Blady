# =============================================================================
# Dependency Update Workflow
# Automated dependency updates and security patches
# =============================================================================

name: 📦 Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - major
          - minor
          - patch

jobs:
  check-updates:
    name: 🔍 Check for Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Check for outdated dependencies
        run: |
          bun outdated || true
          echo "## 📦 Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          bun outdated 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

  auto-update-patch:
    name: 🔄 Auto-update Patch Versions
    runs-on: ubuntu-latest
    needs: check-updates
    if: github.event.inputs.update_type == 'patch' || github.event.inputs.update_type == 'all' || github.event_name == 'schedule'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Update dependencies (patch only)
        run: bun update --patch

      - name: Run tests after update
        run: bun test --ci || echo "Tests not configured"

      - name: Create PR for updates
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update patch versions"
          title: "🤖 Auto-update: Patch Dependencies"
          body: |
            ## Automated Dependency Update
            
            This PR contains automatic patch version updates.
            
            ### Changes
            - Updated packages to latest patch versions
            
            ### ✅ Checks
            - [x] Tests passed
            - [x] Build successful
            
            Please review and merge if everything looks good!
          branch: feature/auto-deps-update
          delete-branch: true
