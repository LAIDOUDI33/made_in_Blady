# AlgeriaTrade.dz - Performance Monitoring Pipeline
# Lighthouse CI, Web Vitals tracking, and performance regression detection

name: ⚡ Performance Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      urls:
        description: 'Custom URLs to test (comma-separated)'
        required: false
      budget_only:
        description: 'Only run budget checks (skip full audit)'
        required: false
        default: false
        type: boolean

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  LIGHTHOUSE_CI_VERSION: '^12'

jobs:
  # ===========================================
  # JOB 1: Lighthouse CI Audit
  # ===========================================
  lighthouse-audit:
    name: 🔍 Lighthouse CI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://algeriatrade.dz/
          - https://algeriatrade.dz/products
          - https://algeriatrade.dz/suppliers
          - https://algeriatrade.dz/login
          - https://algeriatrade.dz/register
          - https://algeriatrade.dz/search?q=electronics
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@${{ env.LIGHTHOUSE_CI_VERSION }}
      
      - name: 🔍 Run Lighthouse Audit
        id: lighthouse
        if: github.event.inputs.budget_only != 'true'
        run: |
          echo "::group::Lighthouse Audit for ${{ matrix.url }}"
          
          lhci autorun \
            --collect.url="${{ matrix.url }}" \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=./lighthouse-results \
            || true
          
          echo "::endgroup::"
        continue-on-error: true
      
      - name: 📊 Extract Scores
        id: scores
        if: always() && steps.lighthouse.outcome != 'skipped'
        run: |
          RESULT_FILE="./lighthouse-results/manifest.json"
          
          if [ -f "$RESULT_FILE" ]; then
            # Extract scores from latest result
            PERFORMANCE=$(jq '.[-1].summary.performance * 100 | floor' $RESULT_FILE 2>/dev/null || echo "0")
            ACCESSIBILITY=$(jq '.[-1].summary.accessibility * 100 | floor' $RESULT_FILE 2>/dev/null || echo "0")
            BEST_PRACTICES=$(jq '.[-1].summary["best-practices"] * 100 | floor' $RESULT_FILE 2>/dev/null || echo "0")
            SEO=$(jq '.[-1].summary.seo * 100 | floor' $RESULT_FILE 2>/dev/null || echo "0")
            
            echo "performance=${PERFORMANCE}" >> $GITHUB_OUTPUT
            echo "accessibility=${ACCESSIBILITY}" >> $GITHUB_OUTPUT
            echo "best_practices=${BEST_PRACTICES}" >> $GITHUB_OUTPUT
            echo "seo=${SEO}" >> $GITHUB_OUTPUT
            
            echo "## ⚡ Lighthouse Results: ${{ matrix.url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Score |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Performance** | ${PERFORMANCE}/100 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Accessibility** | ${ACCESSIBILITY}/100 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Best Practices** | ${BEST_PRACTICES}/100 |" >> $GITHUB_STEP_SUMMARY
            echo "| **SEO** | ${SEO}/100 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results found"
            echo "performance=0" >> $GITHUB_OUTPUT
          fi
      
      - name: 📤 Upload Lighthouse Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.url | replace('https://', '') | replace('/', '-') }}
          path: ./lighthouse-results/
          retention-days: 14

  # ===========================================
  # JOB 2: Budget Validation
  # ===========================================
  budget-check:
    name: 💰 Performance Budget Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@${{ env.LIGHTHOUSE_CI_VERSION }}
      
      - name: 💰 Validate Against Budgets
        id: budget
        run: |
          cat > lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "url": ["https://algeriatrade.dz/"],
                "numberOfRuns": 3
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", {"minScore": 0.9}],
                  "categories:accessibility": ["error", {"minScore": 0.95}],
                  "categories:best-practices": ["error", {"minScore": 0.9}],
                  "categories:seo": ["error", {"minScore": 0.9}],
                  "first-contentful-paint": ["error", {"maxNumericValue": 2000}],
                  "largest-contentful-paint": ["error", {"maxNumericValue": 2500}],
                  "cumulative-layout-shift": ["error", {"maxNumericValue": 0.1}],
                  "total-blocking-time": ["error", {"maxNumericValue": 300}],
                  "speed-index": ["error", {"maxNumericValue": 3400}],
                  "resource-summary:script:size": ["warning", {"maxNumericValue": 300000}],
                  "resource-summary:total:size": ["warning", {"maxNumericValue": 1500000}],
                  "uses-long-cache-ttl": ["off"],
                  "is-on-https": ["error"],
                  "no-unlisted-listeners": ["off"],
                  "unused-javascript": ["warning"]
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": "./budget-results"
              }
            }
          }
          EOF
          
          lhci autorun || true
          
          echo "budget_complete=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: 📊 Budget Report
        if: always()
        run: |
          echo "## 💰 Performance Budget Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./budget-results/manifest.json" ]; then
            cat ./budget-results/manifest.json | jq -r '.[0] | to_entries[] | "- **\(.key)**: \(.value)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Budget check completed"
          else
            echo "No budget results available" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================
  # JOB 3: Web Vitals Tracking
  # ===========================================
  web-vitals:
    name: 📈 Web Vitals Analysis
    runs-on: ubuntu-latest
    needs: lighthouse-audit
    if: always()
    timeout-minutes: 10
    
    steps:
      - name: 📥 Download All Results
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-*
          path: ./all-results
          merge-multiple: true
      
      - name: 📊 Generate Vitals Report
        id: report
        run: |
          cat > web-vitals-report.md << 'EOF'
          # 📈 Core Web Vitals Report
          
          Generated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")
          
          ## Aggregated Results Across Pages
          
          | Metric | Good | Needs Improvement | Poor | Average |
          |--------|------|-------------------|------|---------|
          | FCP | < 1.8s | 1.8s - 3s | > 3s | - |
          | LCP | < 2.5s | 2.5s - 4s | > 4s | - |
          | CLS | < 0.1 | 0.1 - 0.25 | > 0.25 | - |
          | TBT | < 200ms | 200ms - 600ms | > 600ms | - |
          | SI | < 3.4s | 3.4s - 5.6s | > 5.6s | - |
          
          EOF
          
          # Parse all result files and aggregate
          for f in ./all-results/*/manifest.json; do
            if [ -f "$f" ]; then
              URL=$(jq -r '.[0].url // "unknown"' "$f")
              PERF=$(jq -r '[.[].summary.performance] | add / length * 100 | floor' "$f" 2>/dev/null || echo "N/A")
              
              echo "- **${URL}**: Avg Performance ${PERF}" >> web-vitals-report.md
            fi
          done
          
          cat web-vials-report.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          cat web-vitals-report.md
      
      - name: 📤 Upload Vitals Report
        uses: actions/upload-artifact@v4
        with:
          name: web-vitals-report
          path: web-vitals-report.md
          retention-days: 30

  # ===========================================
  # JOB 4: Performance Regression Detection
  # ===========================================
  regression-detection:
    name: 📉 Regression Detection
    runs-on: ubuntu-latest
    needs: lighthouse-audit
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    
    steps:
      - name: 📥 Download Current Results
        uses: actions/download-artifact@v4
        with:
          path: ./current-results
      
      - name: 📥 Get Baseline Results
        id: baseline
        run: |
          # In a real setup, you'd fetch baseline from a data store
          # For now, we'll check if there's a baseline artifact
          echo "Fetching baseline from main branch..."
          
          # This would typically use gh api or a dedicated service
          echo "baseline_fetched=true" >> $GITHUB_OUTPUT
      
      - name: 📉 Compare & Detect Regressions
        id: compare
        run: |
          echo "## 📉 Performance Regression Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          REGRESSIONS_FOUND=false
          
          # Compare current vs baseline (simplified example)
          for dir in ./current-results/lighthouse-*/; do
            if [ -d "$dir" ] && [ -f "${dir}manifest.json" ]; then
              URL=$(jq -r '.[0].url // "unknown"' "${dir}manifest.json")
              CURRENT_PERF=$(jq -r '.[0].summary.performance // 0' "${dir}manifest.json")
              
              # If current is more than 10% below threshold, flag it
              THRESHOLD=0.85
              IS_BELOW=$(echo "$CURRENT_PERF < $THRESHOLD" | bc -l 2>/dev/null || echo "0")
              
              if [ "$IS_BELOW" = "1" ]; then
                echo "⚠️ **Potential regression on ${URL}**: Score $(echo "$CURRENT_PERF * 100" | bc)%" >> $GITHUB_STEP_SUMMARY
                REGRESSIONS_FOUND=true
              else
                echo "✅ ${URL}: No regression detected" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          
          if [ "$REGRESSIONS_FOUND" = true ]; then
            echo "regressions=true" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ **Action Required:** Review performance changes before merging" >> $GITHUB_STEP_SUMMARY
          else
            echo "regressions=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 💬 Comment on PR
        if: steps.compare.outputs.regressions == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `## ⚠️ Performance Regression Detected
            
            This PR may introduce performance regressions. Please review the metrics below.
            
            ### Recommendations
            1. Review bundle size changes
            2. Check for new heavy dependencies
            3. Verify image optimization
            4. Test loading performance locally
            
            ---
            *Automated by Lighthouse CI*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

  # ===========================================
  # JOB 5: Bundle Size Analysis
  # ===========================================
  bundle-analysis:
    name: 📦 Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8'
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: 🏗️ Build Application
        run: pnpm build 2>&1 | tee build-output.txt || true
      
      - name: 📊 Analyze Bundle Size
        id: analyze
        run: |
          echo "## 📦 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Analyze .next directory size
          if [ -d ".next" ]; then
            TOTAL_SIZE=$(du -sh .next | cut -f1)
            STATIC_SIZE=$(du -sh .next/static 2>/dev/null | cut -f1 || echo "0")
            
            echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Build** | ${TOTAL_SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Static Assets** | ${STATIC_SIZE} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # List largest files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Largest Files" >> $GITHUB_STEP_SUMMARY
          find .next -type f -size +100k -exec ls -lh {} \; 2>/dev/null | \
            awk '{print $5, $9}' | sort -rh | head -10 | \
            while read size file; do
              echo "- ${size} ${file##*/}" >> $GITHUB_STEP_SUMMARY
            done || echo "No large files found" >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload Build Analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: |
            build-output.txt
            .next/
          retention-days: 7

  # ===========================================
  # JOB 6: Schedule Regular Audits
  # ===========================================
  scheduled-audit:
    name: 📅 Scheduled Performance Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.urls != ''
    timeout-minutes: 20
    
    steps:
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@${{ env.LIGHTHOUSE_CI_VERSION }}
      
      - name: 🔍 Run Custom URLs
        if: github.event.inputs.urls != ''
        run: |
          IFS=',' read -ra URLS <<< "${{ github.event.inputs.urls }}"
          
          for url in "${URLS[@]}"; do
            echo "Auditing: ${url}"
            lhci collect --url="${url}" --numberOfRuns=2 || true
          done
      
      - name: 📤 Upload Scheduled Results
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-audit-$(date +%Y%m%d)
          path: .lighthouseci/
          retention-days: 30

  # ===========================================
  # FINAL: Performance Gate
  # ===========================================
  performance-gate:
    name: 🚦 Performance Gate
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, budget-check]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: 🚦 Determine Status
        run: |
          LIGHTHOUSE="${{ needs.lighthouse-audit.result }}"
          BUDGET="${{ needs.budget-check.result }}"
          
          echo "# ⚡ Performance Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${LIGHTHOUSE == 'success' && '✅ Passed' || '⚠️ Review'} |" >> $GITHUB_STEP_SUMMARY
          echo "| Budget Validation | ${BUDGET == 'success' && '✅ Passed' || '⚠️ Warnings'} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$LIGHTHOUSE" = "success" ] && [ "$BUDGET" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All performance checks passed!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Review recommended before merge.**" >> $GITHUB_STEP_SUMMARY
            exit 0  # Don't block, just warn
          fi
