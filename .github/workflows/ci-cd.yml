# =============================================================================
# GitHub Actions CI/CD Pipeline - AlgeriaTrade.dz B2B Marketplace
# =============================================================================
# Comprehensive pipeline for:
# - Code quality (linting, type checking)
# - Testing (unit, integration, E2E, performance)
# - Security scanning (dependencies, code analysis)
# - Docker image building and pushing to registry
# - Deployment to staging and production environments
#
# Triggers:
#   - Push to main branch → Build + Deploy to Staging
#   - Pull requests to main → Full test suite
#   - Manual workflow dispatch → Custom deployment
#
# Required Secrets (GitHub Repository Settings > Secrets and variables > Actions):
#   - DOCKER_REGISTRY: Container registry URL (e.g., ghcr.io, docker.io)
#   - DOCKER_USERNAME: Registry username
#   - DOCKER_PASSWORD: Registry password/token
#   - NEXTAUTH_SECRET: NextAuth.js secret key
#   - DATABASE_URL: Production database connection string
#   - SENTRY_DSN: Sentry error tracking DSN
#   - SSH_PRIVATE_KEY: Server deployment key
#   - SSH_HOST: Deployment server hostname
#   - SSH_USER: SSH user for deployment
#
# Environment-specific secrets should be configured in GitHub Environments:
#   - Staging environment: STAGING_* prefixed secrets
#   - Production environment: PRODUCTION_* prefixed secrets
# =============================================================================

name: CI/CD Pipeline

# -----------------------------------------------------------------------------
# Trigger Configuration
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main, develop]
    # Only run on relevant file changes for efficiency
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - none (build only)
      run_e2e:
        description: 'Run E2E tests'
        required: false
        default: true
        type: boolean
      run_performance:
        description: 'Run performance tests'
        required: false
        default: false
        type: boolean
      deploy_version:
        description: 'Version tag (e.g., v1.2.3 or latest)'
        required: false
        default: 'latest'

# Cancel in-progress runs for the same branch (saves resources)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables
env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.1'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository_owner }}/algeriatrade
  # Cache configuration
  BUN_CACHE_PATH: ~/.bun/install/cache

# =============================================================================
# Jobs Definition
# =============================================================================
jobs:

  # ===========================================================================
  # Job 1: Code Quality & Linting
  # ===========================================================================
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 💾 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Run ESLint
        id: eslint
        run: bun run lint --max-warnings=0
        continue-on-error: false

      - name: 📝 TypeScript type checking
        id: typescript
        run: bunx tsc --noEmit --strict

      - name: 🔒 Security vulnerability audit
        id: audit
        run: |
          echo "## 🔒 Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          bun audit 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          
          # Check for critical/high vulnerabilities
          CRITICAL=$(bun audit 2>/dev/null | grep -c "critical" || echo "0")
          HIGH=$(bun audit 2>/dev/null | grep -c "high" || echo "0")
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 5 ]; then
            echo "::warning::Security vulnerabilities detected. Review audit results."
          fi

  # ===========================================================================
  # Job 2: Unit Tests
  # ===========================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      fail-fast: false
      matrix:
        # Test across different Node versions for compatibility
        node-version: [20]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 💾 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧪 Run unit tests with coverage
        id: unit_test
        run: |
          bun run test:unit --coverage --ci --reporters=default --reporters=junit --outputFile=unit-test-results.xml
        env:
          CI: true
          NODE_ENV: test
          NEXTAUTH_SECRET: test-secret-for-ci
          DATABASE_URL: file:./test.db

      - name: 📤 Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.node-version }}
          path: |
            junit.xml
            coverage/
          retention-days: 7

      - name: 📊 Generate coverage summary
        if: always()
        run: |
          echo "## 🧪 Unit Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/lcov.info ]; then
            echo "✅ Coverage report generated" >> $GITHUB_STEP_SUMMARY
            ls -la coverage/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "⚠️ No coverage data available" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Job 3: API Integration Tests
  # ===========================================================================
  api-tests:
    name: 🔌 API Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    # Service containers for testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: algeriatrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: ⏳ Wait for services to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping | grep -q PONG; do
            echo "⏳ Waiting for Redis..."
            sleep 2
          done
          echo "✅ All services ready"

      - name: 🔄 Run database migrations
        run: |
          bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test

      - name: 🌱 Seed test database
        run: |
          bunx prisma db seed 2>/dev/null || echo "Seed completed with warnings"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test

      - name: 🔌 Run API integration tests
        id: api_test
        run: |
          jest __tests__/api --coverage --ci --forceExit --detectOpenHandles \
            --reporters=default --reporters=junit --outputFile=api-test-results.xml
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: 📤 Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            api-test-results.xml
            coverage/
          retention-days: 7

  # ===========================================================================
  # Job 4: Build Verification
  # ===========================================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build Next.js application
        id: build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://algeriatrade.dz
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          ANALYTICS_ID: ''

      - name: 📊 Check build output size
        run: |
          echo "## 📦 Build Output Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh .next/* 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          
          BUILD_SIZE=$(du -sb .next 2>/dev/null | cut -f1 || echo "0")
          MAX_SIZE=$((500 * 1024 * 1024)) # 500MB limit
          
          if [ "$BUILD_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::warning::Build size $(echo "scale=2; $BUILD_SIZE/1048576" | bc)MB exceeds 500MB limit"
            echo "⚠️ **Warning**: Build size exceeds recommended limit of 500MB" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Build size within acceptable limits" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # ===========================================================================
  # Job 5: Docker Image Build & Push
  # ===========================================================================
  docker-build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, api-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔖 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }},enable=true

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_APP_URL=https://algeriatrade.dz

      - name: 📝 Output image info
        run: |
          echo "## 🐳 Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.DOCKER_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 6: Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.algeriatrade.dz
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📋 Display deployment info
        run: |
          echo "## 🚀 Deploying to Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: 🔑 Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
          DEPLOY_SCRIPT: deploy/deploy.sh
        run: |
          # Create deployment script to run on server
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} << 'DEPLOY_EOF'
            set -e
            
            echo "🔄 Starting deployment to staging..."
            
            cd /opt/algeriatrade
            
            # Pull latest image
            docker pull ${IMAGE_TAG}
            
            # Backup current version
            docker save algeriatrade:current | gzip > /backups/staging-$(date +%Y%m%d-%H%M%S).tar.gz 2>/dev/null || true
            
            # Update docker-compose with new image
            export IMAGE_TAG=${IMAGE_TAG}
            docker compose pull
            docker compose up -d --no-deps app
            
            # Wait for health check
            echo "⏳ Waiting for application to be healthy..."
            timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do sleep 5; done'
            
            # Run migrations
            docker compose exec app npx prisma migrate deploy
            
            # Clean up old images
            docker image prune -af --filter "until=24h"
            
            echo "✅ Staging deployment complete!"
          DEPLOY_EOF

      - name: ✅ Verify deployment
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.algeriatrade.dz/api/health || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ **Staging deployment verified successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Staging deployment may have failed** (HTTP $HTTP_STATUS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ===========================================================================
  # Job 7: Deploy to Production
  # ===========================================================================
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-staging]
    if: github.ref == 'refs/heads/main' && success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    environment:
      name: production
      url: https://algeriatrade.dz
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚠️ Production deployment confirmation
        run: |
          echo "## 🏭 PRODUCTION DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **⚠️ This will deploy to PRODUCTION**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ needs.docker-build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: 🔑 Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: 🏭 Deploy via SSH (Zero-Downtime)
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} << 'DEPLOY_EOF'
            set -e
            
            echo "🏭 Starting PRODUCTION deployment..."
            echo "⏰ $(date)"
            
            cd /opt/algeriatrade
            
            # Create backup before deployment
            echo "💾 Creating backup..."
            mkdir -p /backups
            BACKUP_FILE="/backups/prod-$(date +%Y%m%d-%H%M%S).tar.gz"
            docker compose exec -T postgres pg_dump -U algeriatrade algeriatrade | gzip > "${BACKUP_FILE}.sql.gz" 2>/dev/null || true
            
            # Pull new image
            echo "📥 Pulling new image..."
            docker pull ${IMAGE_TAG}
            
            # Blue-green deployment for zero downtime
            echo "🔄 Starting blue-green deployment..."
            
            # Start new container alongside old one
            IMAGE_TAG=${IMAGE_TAG} docker compose up -d --no-recreate --no-deps app-new 2>/dev/null || \
            IMAGE_TAG=${IMAGE_TAG} docker compose up -d --no-deps app
            
            # Wait for new container to be healthy
            echo "⏳ Waiting for health check..."
            if ! timeout 180 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do sleep 5; done'; then
              echo "❌ Health check failed! Rolling back..."
              docker compose rollback || docker compose restart
              exit 1
            fi
            
            # Run database migrations
            echo "🔄 Running database migrations..."
            docker compose exec -T app npx prisma migrate deploy || true
            
            # Reload nginx to switch traffic
            echo "🔄 Reloading nginx..."
            docker compose exec -T nginx nginx -s reload
            
            # Remove old container after successful deployment
            echo "🧹 Cleaning up..."
            docker image prune -af --filter "until=48h" 2>/dev/null || true
            
            echo ""
            echo "✅ PRODUCTION deployment complete!"
            echo "⏰ $(date)"
            echo "📦 Backup: ${BACKUP_FILE}"
          DEPLOY_EOF

      - name: ✅ Verify production deployment
        run: |
          echo "⏳ Waiting for DNS propagation and application startup..."
          sleep 45
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://algeriatrade.dz/api/health || echo "000")
          
          echo "## ✅ Production Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ **Production deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **URL:** https://algeriatrade.dz" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** \`HTTP ${HTTP_STATUS}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Production deployment may need manual verification**" >> $GITHUB_STEP_SUMMARY
            echo "- **HTTP Status:** \`${HTTP_STATUS}\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 📧 Send deployment notification
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "AlgeriaTrade.dz Deployment",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && '✅' || '❌' }} Production Deployment ${{ job.status == 'success' && 'Success' || 'Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Commit:*\n`${{ github.sha }}`"},
                    {"type": "mrkdwn", "text": "*Deployed by:*\n@${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Environment:*\nProduction"},
                    {"type": "mrkdwn", "text": "*Time:*\n$(date -u)"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {"type": "button", "text": {"type": "plain_text", "text": "View Dashboard"}, "url": "https://algeriatrade.dz", "style": "primary"}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ===========================================================================
  # Final: Pipeline Summary
  # ===========================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, api-tests, build, docker-build]
    if: always()
    
    steps:
      - name: 📊 Generate pipeline summary
        run: |
          echo "# 📊 AlgeriaTrade.dz CI/CD Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint & Type Check | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API Tests | ${{ needs.api-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Pipeline run: \`${{ github.run_id }}\`*" >> $GITHUB_STEP_SUMMARY
          echo "*Triggered by: @${{ github.actor }}*" >> $GITHUB_STEP_SUMMARY
