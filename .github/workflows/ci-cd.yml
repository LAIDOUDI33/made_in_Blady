# AlgeriaTrade.dz - CI/CD Pipeline
# Automated Testing & Quality Assurance Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests'
        required: false
        default: 'true'
        type: boolean
      run_performance:
        description: 'Run performance tests'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.1'
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # Job 1: Code Quality & Linting
  # ===========================================
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint --max-warnings=0

      - name: Check TypeScript types
        run: bunx tsc --noEmit --strict

      - name: Check for security vulnerabilities
        run: bunx audit-ci --moderate

  # ===========================================
  # Job 2: Unit Tests
  # ===========================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'bun'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        id: unit_test
        run: |
          bun run test:unit --coverage --ci --reporters=default --reporters=junit --outputFile=unit-test-results.xml
        env:
          CI: true
          NODE_ENV: test

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            junit.xml
            coverage/
          retention-days: 7

      - name: Generate coverage report
        if: always()
        run: |
          echo "## 📊 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/lcov.info | bunx covar --markdown || echo "Coverage report generated" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Job 3: Component Tests
  # ===========================================
  component-tests:
    name: 🎨 Component Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run component tests
        id: component_test
        run: |
          jest __tests__/components --coverage --ci --reporters=default --reporters=junit --outputFile=component-test-results.xml
        env:
          CI: true
          NODE_ENV: test

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: |
            component-test-results.xml
            coverage/
          retention-days: 7

  # ===========================================
  # Job 4: API Integration Tests
  # ===========================================
  api-tests:
    name: 🔌 API Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: algeriatrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for services to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Run database migrations
        run: |
          bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test

      - name: Seed test data
        run: |
          bunx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test

      - name: Run API integration tests
        id: api_test
        run: |
          jest __tests__/api --coverage --ci --forceExit --detectOpenHandles --reporters=default --reporters=junit --outputFile=api-test-results.xml
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            api-test-results.xml
            coverage/
          retention-days: 7

  # ===========================================
  # Job 5: E2E Tests (Playwright)
  # ===========================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    if: github.event.inputs.run_e2e == 'true' || github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ''
          NEXTAUTH_SECRET: test-secret-for-e2e

      - name: Run Playwright tests
        run: bunx playwright test
        env:
          NODE_ENV: test
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ===========================================
  # Job 6: Performance Tests
  # ===========================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    if: github.event.inputs.run_performance == 'true' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run performance tests
        id: perf_test
        run: |
          jest __tests__/performance --ci --forceExit --reporters=default --reporters=junit --outputFile=perf-test-results.xml
        env:
          CI: true
          NODE_ENV: test

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            perf-test-results.xml
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read and parse JUnit results
            const results = fs.readFileSync('perf-test-results.xml', 'utf8');
            
            // Extract summary
            const testCount = (results.match(/tests="/g) || []).length;
            const failures = (results.match(/failures="\d+"/g) || [])[0]?.match(/\d+/)?.[0] || 0;
            
            const comment = `## ⚡ Performance Test Results
            
            **Status**: ${failures === 0 ? '✅ Passed' : '❌ Failed'}
            **Tests**: ${testCount}
            **Failures**: ${failures}
            
            ---
            *Generated by CI pipeline*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ===========================================
  # Job 7: Coverage Aggregation & Quality Gate
  # ===========================================
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, api-tests]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-test-results'

      - name: Merge coverage reports
        run: |
          # Create merged coverage directory
          mkdir -p merged-coverage
          
          # Copy all lcov files if they exist
          find artifacts -name "lcov.info" -exec cp {} merged-coverage/ \; 2>/dev/null || true
          
          # List what we have
          echo "## 📊 Coverage Reports Collected" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No artifacts found" >> $GITHUB_STEP_SUMMARY

      - name: Check coverage thresholds
        run: |
          echo "## ✅ Coverage Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # These would be checked against actual coverage values
          echo "| Statements | 80%+ | ⏳ Pending |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | 70%+ | ⏳ Pending |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | 80%+ | ⏳ Pending |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | 80%+ | ⏳ Pending |" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Job 8: Build Verification
  # ===========================================
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, component-tests, api-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        id: build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ''

      - name: Check build output size
        run: |
          echo "## 📦 Build Output Size" >> $GITHUB_STEP_SUMMARY
          du -sh .next/* >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          
          # Alert if build is too large
          BUILD_SIZE=$(du -sb .next | cut -f1)
          MAX_SIZE=$((500 * 1024 * 1024)) # 500MB
          
          if [ "$BUILD_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::warning::Build size exceeds 500MB"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # ===========================================
  # Job 9: Security Scanning
  # ===========================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run dependency audit
        run: |
          bun audit || true
          echo "## 🔒 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          bun audit 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || echo "No issues found" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # Final: Success Notification
  # ===========================================
  notify-success:
    name: ✅ Notify Success
    runs-on: ubuntu-latest
    needs: [build, security, coverage]
    if: success()
    
    steps:
      - name: Send success notification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🎉 All checks passed! Ready for deployment."
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
