# =============================================================================
# GitHub Actions - Deploy AlgeriaTrade
# =============================================================================
# Pipeline CI/CD pour AlgeriaTrade.dz
# - Tests et lint sur chaque PR
# - Déploiement Vercel sur main
# - Déploiement Docker serveur dédié (optionnel)
# =============================================================================

name: Deploy AlgeriaTrade

# -----------------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
  pull_request:
    branches:
      - main

  # Permettre le déclenchement manuel
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement de déploiement'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      skip_tests:
        description: 'Skip les tests'
        required: false
        type: boolean
        default: false

# -----------------------------------------------------------------------------
# Concurrency - Éviter les déploiements parallèles
# -----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# Environnements
# -----------------------------------------------------------------------------
environments:
  production:
    url: https://algeriatrade.dz
  staging:
    url: https://staging.algeriatrade.dz

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1 : Tests et Validation
  # ---------------------------------------------------------------------------
  test:
    name: "Tests & Lint"
    runs-on: ubuntu-latest
    
    # Services pour les tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: algeriatrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Cache des dépendances
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Installation des dépendances
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Linting
      - name: Run ESLint
        run: bun run lint
        continue-on-error: false

      # Type checking
      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: false

      # Build
      - name: Build application
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci
          REDIS_URL: redis://localhost:6379

      # Tests unitaires (si disponibles)
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: bun run test:ci || echo "No tests configured yet"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/algeriatrade_test
          NEXTAUTH_SECRET: test-secret-for-ci
          REDIS_URL: redis://localhost:6379

      # Upload artefacts de build
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 : Déploiement Vercel (Production)
  # ---------------------------------------------------------------------------
  deploy-vercel-production:
    name: "Deploy to Vercel Production"
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: .

      # Commenter le PR avec l'URL de déploiement
      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Déployé avec succès!**\n\n📦 Preview: ${{ steps.deploy.outputs.preview-url }}`
            })

  # ---------------------------------------------------------------------------
  # Job 3 : Déploiement Vercel (Preview/Staging)
  # ---------------------------------------------------------------------------
  deploy-vercel-preview:
    name: "Deploy to Vercel Preview"
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      # Commenter le PR
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 **Preview déployée!**\n\n🔗 [Voir la preview](${{ steps.deploy.outputs.preview-url }})\n\nCette preview sera mise à jour à chaque commit.`
            })

  # ---------------------------------------------------------------------------
  # Job 4 : Déploiement Docker (Serveur Dédié)
  # ---------------------------------------------------------------------------
  deploy-docker:
    name: "Deploy to Docker Server"
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment to production server..."
            
            # Aller dans le répertoire du projet
            cd /opt/algeriatrade || exit 1
            
            # Sauvegarder la version actuelle
            cp -r .next .next.backup.$(date +%Y%m%d%H%M%S) || true
            
            # Récupérer les derniers changements
            git fetch origin main
            git reset --hard origin/main
            
            # Mettre à jour les dépendances
            bun install --production=false
            
            # Rebuild l'application
            bun run build
            
            # Redémarrer les services Docker
            docker-compose -f docker-compose.prod.yml pull || true
            docker-compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Attendre que l'app soit pronte
            sleep 30
            
            # Vérifier le health check
            curl -f http://localhost:3000/api/health || {
              echo "❌ Health check failed!"
              docker-compose -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            }
            
            # Nettoyer les anciennes images
            docker image prune -f
            
            # Nettoyer les anciens backups (garder les 5 derniers)
            ls -dt .next.backup.* 2>/dev/null | tail -n +6 | xargs rm -rf || true
            
            echo "✅ Deployment completed successfully!"

      # Notification Slack (optionnel)
      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *AlgeriaTrade* déployé avec succès!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Déployment Réussi*\n🌐 https://algeriatrade.dz\n👤 Par: ${{ github.actor }}\n📝 Commit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *Échec du déploiement AlgeriaTrade!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Déployment Échoué*\n👤 Par: ${{ github.actor }}\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 5 : Database Backup (après déploiement réussi)
  # ---------------------------------------------------------------------------
  backup-database:
    name: "Backup Database"
    needs: [deploy-vercel-production, deploy-docker]
    if: always() && needs.deploy-vercel-production.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Create backup via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/algeriatrade
            
            # Créer un timestamp
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Backup PostgreSQL
            docker exec algeriatrade-postgres-prod pg_dump \
              -U algeriatrade \
              -d algeriatrade \
              --clean \
              --if-exists \
              > ./backups/db_backup_${TIMESTAMP}.sql.gz
            
            # Upload vers S3 (optionnel)
            # aws s3 cp ./backups/db_backup_${TIMESTAMP}.sql.gz s3://algeriatrade-backups/database/
            
            # Nettoyer les vieux backups (garder 30 jours)
            find ./backups -name "*.sql.gz" -mtime +30 -delete
            
            echo "✅ Database backup completed: db_backup_${TIMESTAMP}.sql.gz"
        continue-on-error: true
