# =============================================================================
# Nginx Configuration - AlgeriaTrade.dz B2B Marketplace (Production)
# =============================================================================
# Production-optimized reverse proxy configuration:
#
# Features:
# - HTTP → HTTPS automatic redirect
# - SSL/TLS termination with modern cipher suites
# - Gzip compression (critical for Algeria's bandwidth constraints)
# - Static asset caching with optimal headers
# - WebSocket proxy support (Socket.IO for real-time features)
# - Rate limiting for DDoS protection
# - Comprehensive security headers (CSP, HSTS, X-Frame-Options, etc.)
# - Large file upload support (up to 500MB for product videos)
# - Bot/scraper blocking
# - Let's Encrypt ACME challenge support
#
# Usage:
#   Copy to: /etc/nginx/nginx.conf or /etc/nginx/conf.d/algeriatrade.conf
#   Test:    nginx -t
#   Reload:  nginx -s reload
#
# Requirements:
#   - SSL certificates in /etc/nginx/certs/
#   - Next.js app running on port 3000 (Docker network)
#   - Socket.IO service on port 3003 (optional)
#
# Documentation: https://docs.algeriatrade.dz/deployment/nginx
# =============================================================================

# -----------------------------------------------------------------------------
# Worker Processes & Events Configuration
# -----------------------------------------------------------------------------
# Auto-detect number of CPU cores for optimal performance
worker_processes auto;

# Maximum file descriptors per worker process
worker_rlimit_nofile 65535;

events {
    # Maximum simultaneous connections per worker
    worker_connections 4096;
    
    # Accept multiple connections at once
    multi_accept on;
    
    # Use epoll for Linux (most efficient)
    use epoll;
}

# -----------------------------------------------------------------------------
# HTTP Block - Global Settings
# -----------------------------------------------------------------------------
http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # UTF-8 charset for proper Arabic/French content support
    charset utf-8;
    
    # -------------------------------------------------------------------------
    # Logging Configuration
    # -------------------------------------------------------------------------
    
    # Detailed log format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time '
                    'upstream_response_time=$upstream_response_time';
    
    # JSON format for log aggregation (ELK/Loki)
    log_format json_log escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id"'
        '}';
    
    # Access log with buffering for performance
    access_log /var/log/nginx/access.log main buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Performance Optimizations
    # -------------------------------------------------------------------------
    
    # Sendfile optimization (kernel-level file copy)
    sendfile        on;
    tcp_nopush      on;  # Optimize data packets
    tcp_nodelay     on;  # Disable Nagle's algorithm for better latency
    
    # Keep-alive timeout (seconds)
    keepalive_timeout 65;
    
    # Hash table sizes
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    
    # Hide Nginx version (security best practice)
    server_tokens off;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS Protection)
    # -------------------------------------------------------------------------
    
    # General rate limit: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    
    # API rate limit: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    
    # Strict API rate limit: 30 requests/minute (sensitive endpoints)
    limit_req_zone $binary_remote_addr zone=strict_api:10m rate=30r/m;
    
    # Authentication rate limit: 5 requests/minute (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    
    # Upload rate limit: 10 requests/minute
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    
    # Connection limiting per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Status codes for rate limiting
    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Upstream Definition (Next.js Application)
    # -------------------------------------------------------------------------
    upstream nextjs_app {
        server app:3000;
        
        # Keepalive connections to backend (improves performance)
        keepalive 64;
        
        # Load balancing method options:
        # - round-robin (default)
        # - least_conn; (least connections)
        # - ip_hash; (session affinity)
    }

    # Upstream for message service (Socket.IO)
    upstream socket_service {
        server message-service:3003;
    }

    # -------------------------------------------------------------------------
    # Gzip Compression (Critical for Algeria's Bandwidth Constraints)
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    
    # Compressible MIME types
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom+xml
        application/ld+json;

    # Disable gzip for broken legacy browsers
    gzip_disable "msie6";

    # -------------------------------------------------------------------------
    # WebSocket Upgrade Mapping
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # Real IP detection behind proxies
    map $http_x_forwarded_for $real_ip {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }
    
    # Request ID for tracing
    map $request_id $req_id {
        default $request_id;
        ""      $pid-$msec-$remote_addr-$request_length;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS Redirect Server
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name algeriatrade.dz www.algeriatrade.dz *.algeriatrade.dz 
                    staging.algeriatrade.dz api.algeriatrade.dz;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
        
        # Let's Encrypt ACME challenge location (for certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            # Don't redirect ACME challenges
            # This overrides the 301 redirect above
        }
    }

    # -------------------------------------------------------------------------
    # Main HTTPS Server - AlgeriaTrade.dz Production
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name algeriatrade.dz www.algeriatrade.dz;
        
        # -----------------------------------------------------------------
        # SSL/TLS Configuration
        # -----------------------------------------------------------------
        
        # SSL certificate paths (Let's Encrypt or custom)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        
        # Modern TLS protocols only (disable insecure versions)
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Strong cipher suites (prioritize ECDHE + AES-GCM/CHACHA20)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;
        ssl_prefer_server_ciphers off;
        
        # SSL session caching (performance optimization)
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP Stapling (privacy & performance improvement)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;
        
        # Elliptic curve for key exchange
        ssl_ecdh_curve secp384r1;
        
        # -----------------------------------------------------------------
        # Security Headers
        # -----------------------------------------------------------------
        
        # Prevent clickjacking attacks
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # XSS Protection (for legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer policy for privacy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Permissions policy (restrict browser APIs)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=(self)" always;
        
        # Content Security Policy (CSP) - Adjust based on your CDN/script needs
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://analytics.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https: https://*.sentry.io https://*.google-analytics.io https://*.vercel-insights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        
        # HSTS - Force HTTPS for 2 years including subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # Remove server identification headers
        more_clear_headers Server;
        more_clear_headers X-Powered-By;
        
        # Add request ID header for tracing
        add_header X-Request-ID $req_id always;
        
        # -----------------------------------------------------------------
        # Client Limits (DoS Protection)
        # -----------------------------------------------------------------
        
        # Maximum upload size (500MB for product videos)
        client_max_body_size 500M;
        
        # Buffer sizes
        client_body_buffer_size 256k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 16k;
        
        # Timeouts (optimized for Algeria's network conditions)
        client_body_timeout 300s;   # Long timeout for large uploads
        client_header_timeout 30s;
        
        # Connection limits
        limit_conn conn_limit 50;
        
        # -----------------------------------------------------------------
        # Proxy Timeouts
        # -----------------------------------------------------------------
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;      # Long timeout for uploads
        proxy_read_timeout 120s;      # For slow connections
        send_timeout 120s;
        keepalive_timeout 65;
        
        # -----------------------------------------------------------------
        # Logging
        # -----------------------------------------------------------------
        access_log /var/log/nginx/algeriatrade_access.log main buffer=512k flush=1m;
        error_log /var/log/nginx/algeriatrade_error.log warn;
        
        # -----------------------------------------------------------------
        # Root Directory
        # -----------------------------------------------------------------
        root /var/www/html;
        index index.html index.htm;
        
        # -----------------------------------------------------------------
        # Location Blocks
        # -----------------------------------------------------------------
        
        # Health check endpoint (no rate limiting, minimal logging)
        location /health {
            access_log off;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601","service":"nginx"}';
            add_header Content-Type application/json;
        }
        
        # API Health check (pass through to app)
        location = /api/health {
            proxy_pass http://nextjs_app;
            access_log off;
            add_header Cache-Control "no-store";
            
            # Higher rate limit for monitoring systems
            limit_req zone=general burst=30 nodelay;
        }
        
        # Public status page
        location = /api/status {
            proxy_pass http://nextjs_app;
            access_log off;
            limit_req zone=api burst=20 nodelay;
        }
        
        # Authentication endpoints (strict rate limiting for brute force protection)
        location ~ ^/api/auth/(login|register|reset-password|2fa) {
            proxy_pass http://nextjs_app;
            
            # Proxy headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            # No caching for authentication
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
            
            # Strict rate limiting (5 req/min)
            limit_req zone=auth burst=3 nodelay;
        }
        
        # Main API routes
        location /api/ {
            proxy_pass http://nextjs_app;
            
            # HTTP/1.1 with upgrade support (for SSE/WebSocket)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            # Extended timeouts for complex operations
            proxy_connect_timeout 75s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            
            # No cache for dynamic API responses
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
            
            # Standard API rate limiting
            limit_req zone=api burst=20 nodelay;
        }
        
        # Sensitive admin API endpoints (very strict rate limiting)
        location ~ ^/api/admin/(security|users|settings|payments) {
            proxy_pass http://nextjs_app;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            # Very strict rate limiting
            limit_req zone=strict_api burst=10 nodelay;
        }
        
        # Upload endpoints (special handling for large files)
        location ~ ^/api/(products|documents|videos)/.*upload {
            proxy_pass http://nextjs_app;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            # Extended timeouts for large uploads (up to 10 minutes)
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Upload rate limiting
            limit_req zone=upload burst=5 nodelay;
        }
        
        # Main application proxy
        location / {
            proxy_pass http://nextjs_app;
            
            # HTTP version upgrade for WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $req_id;
            
            # Disable buffering for SSE and real-time features
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            
            # General rate limiting
            limit_req zone=general burst=40 nodelay;
        }
        
        # Socket.IO WebSocket endpoint (real-time messaging/negotiations)
        location /socket.io/ {
            proxy_pass http://socket_service;
            proxy_http_version 1.1;
            
            # Essential WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            # Long timeouts for persistent WebSocket connections (7 days)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # No buffering for real-time communication
            proxy_buffering off;
            
            # Higher connection limit for WebSocket clients
            limit_conn conn_limit 100;
        }
        
        # Next.js static assets (immutable, long-term cache)
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            
            # Aggressive caching - these files have content hashes in names
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # No rate limiting for static assets
            limit_req off;
        }
        
        # Next.js image optimization endpoint
        location /_next/image/ {
            proxy_pass http://nextjs_app;
            
            # Cache optimized images for 7 days
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Uploaded files (products, companies, documents, videos)
        location /uploads/ {
            alias /var/www/uploads/;
            
            # Cache uploaded files for 30 days
            expires 30d;
            add_header Cache-Control "public, no-transform";
            
            # CORS for cross-origin access (CDN, external services)
            add_header Access-Control-Allow-Origin "*";
            
            # Security: Prevent script execution in uploads directory
            location ~* \.(php|pl|py|jsp|asp|sh|cgi|htaccess|htpasswd)$ {
                deny all;
            }
            
            # Deny access to hidden files
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }
        }
        
        # Video files (extended timeout for streaming with range requests)
        location ~* ^/uploads/videos/.*\.(mp4|webm|mov)$ {
            alias /var/www/uploads/videos/;
            
            # Enable MP4 module for seeking/range requests
            mp4;
            
            # Long cache for video content (90 days)
            expires 90d;
            add_header Cache-Control "public, no-transform";
            add_header Accept-Ranges bytes;
            
            # Extended timeouts for video streaming (1 hour)
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
        
        # SEO files
        location = /robots.txt {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }
        
        location = /sitemap.xml {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=3600";
        }
        
        # Favicon
        location = /favicon.ico {
            proxy_pass http://nextjs_app;
            access_log off;
            log_not_found off;
            expires 30d;
        }
        
        # Service Worker (PWA) - Never cache (must update immediately)
        location = /sw.js {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
        
        location = /sw-enhanced.js {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
        
        # PWA Manifest
        location = /manifest.json {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # -----------------------------------------------------------------
        # Error Pages
        # -----------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Custom error page for rate limiting (429 Too Many Requests)
        error_page 429 /429.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later.","retryAfter":60}';
            add_header Retry-After "60" always;
        }
        
        # -----------------------------------------------------------------
        # Bad Bot/Scraper Blocking
        # -----------------------------------------------------------------
        # Block known aggressive bots that don't respect robots.txt
        if ($http_user_agent ~* (SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|Barkrowler|Bytespider)) {
            return 403;
        }
    }

    # -------------------------------------------------------------------------
    # API Subdomain (api.algeriatrade.dz)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.algeriatrade.dz;
        
        # SSL configuration (same as main domain)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        
        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        
        # Larger upload limit for API
        client_max_body_size 500M;
        
        # All requests go to API routes
        location / {
            proxy_pass http://nextjs_app;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            
            proxy_connect_timeout 75s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            add_header Cache-Control "no-store, must-revalidate";
            
            # API rate limiting
            limit_req zone=api burst=30 nodelay;
        }
        
        # Access logging for API
        access_log /var/log/nginx/api_access.log json_log buffer=512k flush=1m;
        error_log /var/log/nginx/api_error.log warn;
    }

    # -------------------------------------------------------------------------
    # Staging Environment (staging.algeriatrade.dz)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name staging.algeriatrade.dz;
        
        ssl_certificate /etc/nginx/certs/staging-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/staging-privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Relaxed security headers for staging
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Staging banner (optional - can be done at app level)
        # add_header X-Staging "true" always;
        
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        access_log /var/log/nginx/staging_access.log main;
    }

    # -------------------------------------------------------------------------
    # Default Server (Catch-all for unknown hostnames)
    # -------------------------------------------------------------------------
    # Drops requests to any hostname not explicitly configured
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        
        # Use self-signed cert or just drop the connection
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        
        # Drop the connection silently (returns nothing)
        return 444;
    }
}
