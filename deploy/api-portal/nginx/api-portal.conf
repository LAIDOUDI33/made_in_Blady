# =============================================================================
# AlgeriaTrade.dz API Developer Portal - Nginx Configuration
# Production Reverse Proxy with SSL, Rate Limiting & Security
# =============================================================================

# -----------------------------------------------------------------------------
# Rate Limiting Zones
# -----------------------------------------------------------------------------

# General rate limiting (requests per IP)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_keygen:10m rate=3r/h;

# Developer-specific rate limiting (by API key)
map $http_x_api_key $api_key_limit {
    "" $binary_remote_addr;
    default $http_x_api_key;
}
limit_req_zone $api_key_limit zone=api_calls:20m rate=1000r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream definition
upstream api_portal_backend {
    server api-gateway:3000;
    
    # Keepalive connections for performance
    keepalive 64;
}

# -----------------------------------------------------------------------------
# Logging Format
# -----------------------------------------------------------------------------
log_format api_portal_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time" '
                          'api_key="$http_x_api_key"';

log_format json_log escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request":"$request",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_api_key":"$http_x_api_key",'
    '"http_x_forwarded_for":"$http_x_forwarded_for"'
'}';

access_log /var/log/nginx/api_access.log api_portal_log;
error_log /var/log/nginx/api_error.log warn;

# -----------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.algeriatrade.dz api.algeriatrade.dz docs.algeriatrade.dz;
    
    # ACME Challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Main HTTPS Server Block
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.algeriatrade.dz;

    # -------------------------------------------------------------------------
    # SSL Configuration
    # -------------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self' wss: https://api.algeriatrade.dz; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # -------------------------------------------------------------------------
    # Connection Limits
    # -------------------------------------------------------------------------
    limit_conn conn_limit 20;

    # -------------------------------------------------------------------------
    # Root & Index
    # -------------------------------------------------------------------------
    root /var/www/static;
    index index.html;

    # -------------------------------------------------------------------------
    # API Endpoints Proxy
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        
        # WebSocket support for playground
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Disable caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # -------------------------------------------------------------------------
    # Authentication Endpoints (Stricter Rate Limiting)
    # -------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add security headers for auth endpoints
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    # -------------------------------------------------------------------------
    # API Key Generation (Very Strict Rate Limiting)
    # -------------------------------------------------------------------------
    location /api/portal/keys {
        limit_req zone=api_keygen burst=2 nodelay;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # External API Gateway (for developer API calls)
    # -------------------------------------------------------------------------
    location /v1/ {
        limit_req zone=api_calls burst=200 nodelay;
        limit_conn conn_limit 30;
        
        # Request body size limit for uploads
        client_max_body_size 10m;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        
        # Response caching for GET requests
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 1m;
    }

    # -------------------------------------------------------------------------
    # WebSocket Support for API Playground
    # -------------------------------------------------------------------------
    location /playground/ws {
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Extended timeouts for WebSocket
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # Next.js Static Assets with Aggressive Caching
    # -------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/static/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Public Assets Caching
    # -------------------------------------------------------------------------
    ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Documentation Pages
    # -------------------------------------------------------------------------
    location /docs {
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Cache documentation pages
        proxy_cache_valid 200 5m;
    }

    # -------------------------------------------------------------------------
    # Health Check Endpoint (No logging, no rate limiting)
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy";
    }

    location /ready {
        proxy_pass http://api_portal_backend/api/ready;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Main Application (Next.js SSR)
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=api_general burst=30 nodelay;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js specific headers
        proxy_set_header X-Nextjs-Cache $sent_http_x_nextjs_cache;
        
        # Disable caching for SSR pages
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Error Pages
    # -------------------------------------------------------------------------
    error_page 497 https://$host:$server_port$request_uri;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /429.html {
        root /var/www/html/errors;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # -------------------------------------------------------------------------
    # Deny Sensitive Files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(env|git|gitignore|dockerignore|md|yml|yaml|json|bak|sql|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# -----------------------------------------------------------------------------
# API Subdomain Configuration (api.algeriatrade.dz)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.algeriatrade.dz;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:API_SSL:20m;
    ssl_session_timeout 4h;

    # CORS headers for API
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Request-ID, X-IDEMPOTency-Key" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Handle preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # API endpoint proxying
    location /v1/ {
        limit_req zone=api_calls burst=500 nodelay;
        client_max_body_size 20m;
        
        proxy_pass http://api_portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        
        # API response timing
        add_header X-Response-Time $request_time always;
        add_header X-Upstream-Time $upstream_response_time always;
    }

    # OpenAPI/Swagger spec
    location /openapi.json {
        proxy_pass http://api_portal_backend;
        proxy_hide_header X-Powered-By;
    }

    location /swagger {
        proxy_pass http://api_portal_backend;
    }
}
