# =============================================================================
# Nginx Configuration - AlgeriaTrade.dz
# =============================================================================
# Reverse proxy optimisé pour le marché algérien
# - Timeouts augmentés pour les connexions lentes
# - Compression activée
# - Headers de sécurité
# - Cache pour les assets statiques
# =============================================================================

# Upstream vers l'application Next.js
upstream nextjs_app {
    server app:3000;
    
    # Keepalive connections pour améliorer la performance
    keepalive 64;
}

# -----------------------------------------------------------------------------
# Configuration HTTP -> HTTPS redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name algeriatrade.dz www.algeriatrade.dz;
    
    # Redirect tout le trafic HTTP vers HTTPS
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# Configuration principale HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name algeriatrade.dz www.algeriatrade.dz;

    # -------------------------------------------------------------------------
    # SSL/TLS Configuration
    # -------------------------------------------------------------------------
    
    # Certificats SSL (Let's Encrypt ou personnalisés)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # Protocoles SSL (sécurisés mais compatibles)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Session SSL (performance)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    
    # Protection contre le clickjacking
    add_header X-Frame-Options "DENY" always;
    
    # Protection MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Protection XSS (navigateurs anciens)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Contrôle du referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Politique de permissions (restreindre les APIs navigateur)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Content Security Policy (ajuster selon vos besoins)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
    
    # HSTS - Forcer HTTPS pour 1 an (inclure les sous-domaines)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Root et index
    # -------------------------------------------------------------------------
    
    root /var/www/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Gzip Compression (important pour l'Algérie - bande passante limitée)
    # -------------------------------------------------------------------------
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom+xml;

    # Brotli compression (si le module est disponible)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml;

    # -------------------------------------------------------------------------
    # Limits (protection DoS)
    # -------------------------------------------------------------------------
    
    # Taille maximale du body client (pour les uploads de fichiers)
    client_max_body_size 50M;
    
    # Buffer limits
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Timeouts optimisés pour l'Algérie (connexions potentiellement lentes)
    # -------------------------------------------------------------------------
    
    # Timeout de connexion (augmenté pour les connexions lentes)
    proxy_connect_timeout 60s;
    
    # Timeout d'envoi (upload)
    proxy_send_timeout 60s;
    
    # Timeout de lecture (download) - augmenté pour les API lentes
    proxy_read_timeout 120s;
    
    # Keepalive timeout
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # Locations
    # -------------------------------------------------------------------------

    # Location principale - Proxy vers Next.js
    location / {
        proxy_pass http://nextjs_app;
        
        # HTTP version upgrade pour WebSocket support
        proxy_http_version 1.1;
        
        # Headers pour le upgrade de connexion (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Désactiver le buffering pour SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        
        # Passer le host original
        proxy_redirect off;
    }

    # API Routes - timeouts plus longs pour les opérations lourdes
    location /api/ {
        proxy_pass http://nextjs_app;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts plus longs pour l'API (traitements complexes)
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 180s;
        
        # Pas de cache pour les réponses API
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Health check endpoint - pas d'auth requise
    location /api/health {
        proxy_pass http://nextjs_app;
        access_log off;
        
        # Rate limit plus élevé pour les monitors
        limit_req zone=api burst=20 nodelay;
    }

    # Status page publique
    location /api/status {
        proxy_pass http://nextjs_app;
        access_log off;
    }

    # Assets statiques Next.js - cache agressif (long terme / immutable)
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        
        # Cache 1 an - ces fichiers ont des hash dans leur nom
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images optimisées par Next.js
    location /_next/image/ {
        proxy_pass http://nextjs_app;
        
        # Cache 7 jours
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Fichiers uploadés (produits, documents, etc.)
    location /uploads/ {
        alias /var/www/uploads/;
        
        # Cache 30 jours pour les images uploadées
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Sécurité : empêcher l'exécution de scripts
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # Robots.txt et sitemap
    location = /robots.txt {
        proxy_pass http://nextjs_app;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        proxy_pass http://nextjs_app;
        add_header Cache-Control "public, max-age=3600";
    }

    # Favicon et assets racine
    location = /favicon.ico {
        proxy_pass http://nextjs_app;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Service Worker (PWA) - ne jamais cacher
    location = /sw.js {
        proxy_pass http://nextjs_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # -------------------------------------------------------------------------
    # Pages d'erreur personnalisées
    # -------------------------------------------------------------------------
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# -----------------------------------------------------------------------------
# Map pour le WebSocket upgrade
# -----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
