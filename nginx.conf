# =============================================================================
# Nginx Configuration - AlgeriaTrade.dz Production
# =============================================================================
# Reverse proxy optimized for production deployment:
# - HTTP → HTTPS redirect
# - Gzip/Brotli compression
# - Static asset caching headers
# - WebSocket proxy support (Socket.IO)
# - Rate limiting for DDoS protection
# - Security headers (CSP, X-Frame-Options, HSTS, etc.)
# - Large file upload support (for videos up to 500MB)
# - Bot/Scraper blocking
# =============================================================================

# -----------------------------------------------------------------------------
# Worker Processes & Events
# -----------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

# -----------------------------------------------------------------------------
# HTTP Block - Global Settings
# -----------------------------------------------------------------------------
http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Charset
    charset utf-8;
    
    # Logging format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time '
                    'upstream_response_time=$upstream_response_time';
    
    log_format json_log escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';
    
    access_log /var/log/nginx/access.log main buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;
    
    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Hide nginx version
    server_tokens off;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS Protection)
    # -------------------------------------------------------------------------
    
    # General rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    
    # API rate limit: 60 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    
    # Strict API rate limit: 30 requests per minute per IP (sensitive endpoints)
    limit_req_zone $binary_remote_addr zone=strict_api:10m rate=30r/m;
    
    # Auth/login rate limit: 5 requests per minute per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    
    # Upload rate limit: 10 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Rate limit status codes
    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Upstream Definition
    # -------------------------------------------------------------------------
    upstream nextjs_app {
        server app:3000;
        
        # Keepalive connections for improved performance
        keepalive 64;
        
        # Load balancing method (round-robin is default)
        # Alternative: least_conn; ip_hash;
    }

    # -------------------------------------------------------------------------
    # Brotli Compression (if module available)
    # -------------------------------------------------------------------------
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript 
    #              text/xml application/xml application/xml+rss text/javascript 
    #              image/svg+xml application/vnd.ms-fontobject font/opentype 
    #              image/x-icon;

    # -------------------------------------------------------------------------
    # Gzip Compression (critical for Algeria's bandwidth constraints)
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    
    # Compressible MIME types
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom+xml
        application/ld+json;

    # Disable gzip for broken browsers
    gzip_disable "msie6";

    # -------------------------------------------------------------------------
    # Map for WebSocket Upgrade
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # Map for real IP detection behind proxy
    map $http_x_forwarded_for $real_ip {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS Redirect Server
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name algeriatrade.dz www.algeriatrade.dz *.algeriatrade.dz;
        
        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
        
        # Let's Encrypt ACME challenge (for certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }
    }

    # -------------------------------------------------------------------------
    # Main HTTPS Server
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name algeriatrade.dz www.algeriatrade.dz;
        
        # -----------------------------------------------------------------
        # SSL/TLS Configuration
        # -----------------------------------------------------------------
        
        # SSL certificates (Let's Encrypt or custom)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        
        # Modern TLS protocols only (disable SSLv3, TLSv1, TLSv1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Strong cipher suites (prioritize ECDHE + AES-GCM)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL session caching (performance optimization)
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP Stapling (privacy & performance)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;
        
        # SSL security options
        ssl_ecdh_curve secp384r1;
        
        # -----------------------------------------------------------------
        # Security Headers
        # -----------------------------------------------------------------
        
        # Prevent clickjacking attacks
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # XSS Protection (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Permissions policy (restrict browser APIs)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        
        # Content Security Policy (adjust based on your needs)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https://*.sentry.io https://*.google-analytics.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        
        # HSTS - Force HTTPS for 2 years including subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # Remove server info
        more_clear_headers Server;
        more_clear_headers X-Powered-By;
        
        # -----------------------------------------------------------------
        # Client Limits (DoS Protection)
        # -----------------------------------------------------------------
        
        # Maximum upload size (500MB for videos)
        client_max_body_size 500M;
        
        # Buffer sizes
        client_body_buffer_size 256k;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 16k;
        
        # Body timeout (longer for large uploads)
        client_body_timeout 300s;
        client_header_timeout 30s;
        
        # Connection limits
        limit_conn conn_limit 50;
        
        # -----------------------------------------------------------------
        # Timeouts (optimized for Algeria's network conditions)
        # -----------------------------------------------------------------
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;      # Long timeout for uploads
        proxy_read_timeout 120s;      # Long timeout for slow connections
        send_timeout 120s;
        keepalive_timeout 65;
        
        # -----------------------------------------------------------------
        # Logging
        # -----------------------------------------------------------------
        access_log /var/log/nginx/access.log main buffer=512k flush=1m;
        error_log /var/log/nginx/error.log warn;
        
        # -----------------------------------------------------------------
        # Root Directory
        # -----------------------------------------------------------------
        root /var/www/html;
        index index.html index.htm;
        
        # -----------------------------------------------------------------
        # Locations
        # -----------------------------------------------------------------
        
        # Health check endpoint (no rate limiting, no logging)
        location /health {
            access_log off;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # API Health check (pass to app, minimal logging)
        location = /api/health {
            proxy_pass http://nextjs_app;
            access_log off;
            add_header Cache-Control "no-store";
            
            # Higher rate limit for monitoring
            limit_req zone=general burst=30 nodelay;
        }
        
        # Status page (public)
        location = /api/status {
            proxy_pass http://nextjs_app;
            access_log off;
            limit_req zone=api burst=20 nodelay;
        }
        
        # Authentication endpoints (strict rate limiting)
        location ~ ^/api/auth/(login|register|reset-password) {
            proxy_pass http://nextjs_app;
            
            # Proxy headers
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for auth
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
            
            # Strict rate limiting for auth endpoints
            limit_req zone=auth burst=3 nodelay;
        }
        
        # Main API routes (with standard rate limiting)
        location /api/ {
            proxy_pass http://nextjs_app;
            
            # WebSocket support for SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Longer timeouts for complex operations
            proxy_connect_timeout 75s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            
            # No cache for API responses
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
            
            # API rate limiting
            limit_req zone=api burst=20 nodelay;
        }
        
        # Sensitive admin API endpoints (strict rate limiting)
        location ~ ^/api/admin/(security|users|settings) {
            proxy_pass http://nextjs_app;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Very strict rate limiting
            limit_req zone=strict_api burst=10 nodelay;
        }
        
        # Upload endpoints (special handling for large files)
        location ~ ^/api/(products|documents|videos)/.*upload {
            proxy_pass http://nextjs_app;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for large uploads
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Disable request body size limit (handled by client_max_body_size)
            # Upload rate limiting
            limit_req zone=upload burst=5 nodelay;
        }
        
        # Main application proxy (with general rate limiting)
        location / {
            proxy_pass http://nextjs_app;
            
            # HTTP version upgrade for WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Disable buffering for SSE/WebSocket
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            
            # General rate limiting
            limit_req zone=general burst=40 nodelay;
        }
        
        # Socket.IO WebSocket endpoint
        location /socket.io/ {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            
            # Essential WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeouts (keep alive for real-time features)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # No buffering for WebSocket
            proxy_buffering off;
            
            # Higher connection limit for WebSocket
            limit_conn conn_limit 100;
        }
        
        # Next.js static assets (immutable, long-term cache)
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            
            # Aggressive caching - these files have content hashes in names
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # No rate limiting for assets
            limit_req off;
        }
        
        # Next.js image optimization
        location /_next/image/ {
            proxy_pass http://nextjs_app;
            
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
        
        # Uploaded files (products, documents, videos)
        location /uploads/ {
            alias /var/www/uploads/;
            
            # Cache uploaded files for 30 days
            expires 30d;
            add_header Cache-Control "public, no-transform";
            
            # CORS for cross-origin access (e.g., CDN)
            add_header Access-Control-Allow-Origin "*";
            
            # Security: prevent script execution in uploads directory
            location ~* \.(php|pl|py|jsp|asp|sh|cgi|htaccess)$ {
                deny all;
            }
            
            # Don't expose hidden files
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }
        }
        
        # Video files (extended timeout for streaming)
        location ~* ^/uploads/videos/.*\.(mp4|webm|mov)$ {
            alias /var/www/uploads/videos/;
            
            # Enable range requests for video seeking
            mp4;
            
            # Long cache for videos
            expires 90d;
            add_header Cache-Control "public, no-transform";
            add_header Accept-Ranges bytes;
            
            # Extended timeouts for video streaming
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
        
        # SEO files
        location = /robots.txt {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }
        
        location = /sitemap.xml {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=3600";
        }
        
        # Favicon and root icons
        location = /favicon.ico {
            proxy_pass http://nextjs_app;
            access_log off;
            log_not_found off;
            expires 30d;
        }
        
        # Service Worker (PWA) - never cache
        location = /sw.js {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
        
        location = /sw-enhanced.js {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
        
        # Manifest.json (PWA)
        location = /manifest.json {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # -----------------------------------------------------------------
        # Error Pages
        # -----------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Custom error page for rate limiting
        error_page 429 /429.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later."}';
        }
        
        # -----------------------------------------------------------------
        # Bad Bot Blocking
        # -----------------------------------------------------------------
        if ($http_user_agent ~* (SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot)) {
            return 403;
        }
    }
    
    # -------------------------------------------------------------------------
    # Default Server (catch-all for unknown hostnames)
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        
        # Use a self-signed cert or just close the connection
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        
        # Drop requests for unknown hostnames
        return 444;
    }
}
