# =============================================================================
# Netlify Configuration - AlgeriaTrade.dz
# =============================================================================
# Configuration pour le déploiement sur Netlify
# Optimisé pour le marché algérien
# =============================================================================

[build]
  # Commande de build avec bun
  command = "bun run build"
  
  # Répertoire de publication (output Next.js)
  publish = ".next"
  
  # Ne pas utiliser le plugin Next.js intégré (on utilise le plugin officiel)
  [build.environment]
    # Version Node.js requise
    NODE_VERSION = "20"
    
    # Utiliser bun comme package manager
    NETLIFY_USE_BUN = "true"
    
    # Flags npm pour le cache
    NPM_FLAGS = "--prefer-offline"
    
    # Désactiver le plugin interne Next.js
    NETLIFY_NEXT_PLUGIN_SKIP = "true"
    
    # Variables d'environnement de build
    NEXT_TELEMETRY_DISABLED = "1"
    NODE_ENV = "production"

# =============================================================================
# Plugin Next.js Officiel
# =============================================================================
[[plugins]]
  # Plugin officiel Next.js pour Netlify
  package = "@netlify/plugin-nextjs"
  
  [plugins.inputs]
    # Configuration du plugin
    enableStrictCSP = true

# =============================================================================
# Redirects - Réécriture d'URLs
# =============================================================================

# API Routes vers fonctions Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false
  
# Service Worker (PWA support)
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = true

# SPA Fallback - Toutes les autres routes vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =============================================================================
# Headers - Sécurité et Performance
# =============================================================================

# Headers globaux pour toutes les ressources
[headers]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Cache pour les assets statiques
    Cache-Control = "public, max-age=3600"

# Headers spécifiques pour l'API
[headers]
  for = "/api/*"
  [headers.values]
    # Pas de cache pour les réponses API
    Cache-Control = "no-store, must-revalidate, no-cache"
    Pragma = "no-cache"
    # CORS pour les requêtes API
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    Access-Control-Max-Age = "86400"

# Headers pour les assets statiques Next.js (cache long terme)
[headers]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers pour les images optimisées
[headers]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Headers pour les fonts
[headers]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# =============================================================================
# Dév / Preview Settings
# =============================================================================

# Context-specific settings
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "preview", NEXT_PUBLIC_APP_URL = "https://preview--algeriatrade.netlify.app" }

[context.branch-deploy]
  environment = { NODE_ENV = "staging" }
